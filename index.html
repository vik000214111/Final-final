<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Particle Cloud Hub - Multi-Screen Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body { margin:0; overflow:hidden; background:#000; font-family:"Courier New", monospace; }
    #info{
      position:absolute; top:20px; left:20px;
      color:rgba(100,200,255,.6); font-size:12px;
      pointer-events:none; z-index:2001;
    }
    #backButton{
      position:absolute; top:20px; left:20px;
      padding:10px 20px;
      background:rgba(100,200,255,.2);
      border:2px solid rgba(100,200,255,.6);
      color:rgba(100,200,255,.9);
      font-family:"Courier New", monospace;
      font-size:14px; cursor:pointer;
      z-index:3000; display:none;
      transition:all .25s;
      pointer-events:auto;
    }
    #backButton:hover{ background:rgba(100,200,255,.4); border-color:rgba(100,200,255,1); }
    #camBox{
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: 220px;
      height: 150px;
      border: 2px solid rgba(255,255,255,.55);
      background: rgba(0,0,0,.25);
      z-index: 4000;
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    #camVideo, #camOverlay{
      position:absolute; left:0; top:0;
      width:100%; height:100%;
      object-fit: cover;
    }
    #camOverlay{ pointer-events:none; }
    #camLabel{
      position:absolute; left:8px; top:6px;
      font-size: 11px;
      color: rgba(255,255,255,.9);
      background: rgba(0,0,0,.35);
      padding: 3px 6px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="info">Hover over portals to interact • Click to enter season realms</div>
  <button id="backButton">← BACK TO HUB</button>
  <video id="webcam" style="display:none;" playsinline></video>
  <div id="camBox">
    <video id="camVideo" autoplay playsinline muted></video>
    <canvas id="camOverlay"></canvas>
    <div id="camLabel">CAM • HANDS</div>
  </div>

  <script>
    // ===========================================
    // CONFIG
    // ===========================================
    const CONFIG = {
      TREE_PARTICLE_COUNT: 2500,
      PARTICLE_SIZE_MIN: 1.5,
      PARTICLE_SIZE_MAX: 3.5,
      PULSE_SPEED: 0.015,
      PULSE_AMOUNT: 0.4,
      CONNECTION_COUNT: 150,
      CONNECTION_DISTANCE: 45,
      CONNECTION_ALPHA: 0.3,
      DUST_COUNT: 200,
      DUST_SPEED: 0.3,
      MOUSE_FIELD_RADIUS: 180,
      MOUSE_FIELD_STRENGTH: 15,
      PARTICLE_COLOR: [100, 200, 255],
      DUST_COLOR: [150, 180, 200],
      CONNECTION_COLOR: [80, 160, 220],
    };

    // ===========================================
    // STATE
    // ===========================================
    let currentState = "hub"; // "hub" | "spring" | "summer" | "autumn" | "winter"

    function setState(newState) {
      console.log(`Switching state: ${currentState} → ${newState}`);
      currentState = newState;

      const infoDiv = document.getElementById("info");
      const backButton = document.getElementById("backButton");

      if (currentState === "hub") {
        infoDiv.style.display = "block";
        backButton.style.display = "none";
      } else {
        infoDiv.style.display = "none";
        backButton.style.display = "block";
        initializeRoom(currentState);
      }
    }

    // ===========================================
    // GLOBALS
    // ===========================================
    let treeParticles = [];
    let dustParticles = [];
    let connections = [];
    let portals = [];
    let timeOffset = 0;
    let mouseFieldActive = false;

    // MediaPipe Hands - Global handData object
    window.handData = null;
    let prevHandCenters = []; // For velocity calculation
    let cameraReady = false;
    let handsInstance = null;

    // ===========================================
    // MEDIAPIPE HANDS INITIALIZATION
    // ===========================================
    function calculateHandCenter(landmarks) {
      // Use wrist (0) and palm base points (1, 5, 9, 13, 17)
      const indices = [0, 1, 5, 9, 13, 17];
      let sumX = 0, sumY = 0, sumZ = 0;
      for (let idx of indices) {
        sumX += landmarks[idx].x;
        sumY += landmarks[idx].y;
        sumZ += landmarks[idx].z;
      }
      return {
        x: sumX / indices.length,
        y: sumY / indices.length,
        z: sumZ / indices.length
      };
    }

    function calculatePinch(landmarks) {
      // Distance between thumb tip (4) and index tip (8)
      const thumb = landmarks[4];
      const index = landmarks[8];
      const dx = thumb.x - index.x;
      const dy = thumb.y - index.y;
      const dz = thumb.z - index.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      // Normalize: typical pinch is < 0.05, open is > 0.15
      const value = 1 - Math.min(1, Math.max(0, (dist - 0.02) / 0.13));
      const isPinching = value > 0.55;
      return { isPinching, value };
    }

    function calculateOpenness(landmarks) {
      // Average distance from fingertips (4,8,12,16,20) to palm center
      const center = calculateHandCenter(landmarks);
      const tips = [4, 8, 12, 16, 20];
      let totalDist = 0;
      for (let idx of tips) {
        const dx = landmarks[idx].x - center.x;
        const dy = landmarks[idx].y - center.y;
        totalDist += Math.sqrt(dx*dx + dy*dy);
      }
      const avgDist = totalDist / tips.length;
      // Normalize: closed hand ~0.1, open hand ~0.25
      return Math.min(1, Math.max(0, (avgDist - 0.1) / 0.15));
    }

    function onHandResults(results) {
      const now = performance.now();

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        window.handData = {
          timestamp: now,
          hands: [],
          debug: { fpsHands: 0, hasCamera: cameraReady, errors: null }
        };
        prevHandCenters = [];
        return;
      }

      const hands = [];

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const landmarks = results.multiHandLandmarks[i];
        const handedness = results.multiHandedness && results.multiHandedness[i]
          ? results.multiHandedness[i].label
          : "Unknown";

        // Convert to pixel coordinates
        const webcamEl = document.getElementById("webcam");
        const vw = webcamEl?.videoWidth || 640;
        const vh = webcamEl?.videoHeight || 480;

        const keypointsPx = landmarks.map(lm => ({
          x: lm.x * width,
          y: lm.y * height
        }));

        const keypointsCamPx = landmarks.map(lm => ({
          x: lm.x * vw,
          y: lm.y * vh
        }));

        const center = calculateHandCenter(landmarks);
        const centerPx = { x: center.x * width, y: center.y * height };

        // Calculate velocity
        let velocity = { x: 0, y: 0, speed: 0 };
        if (prevHandCenters[i]) {
          velocity.x = centerPx.x - prevHandCenters[i].x;
          velocity.y = centerPx.y - prevHandCenters[i].y;
          velocity.speed = Math.sqrt(velocity.x*velocity.x + velocity.y*velocity.y);
        }

        const pinch = calculatePinch(landmarks);
        const openness = calculateOpenness(landmarks);

        hands.push({
          handedness,
          landmarks,  // Normalized 0-1
          keypointsPx,
          keypointsCamPx,
          center: centerPx,
          velocity,
          pinch,
          openness
        });

        prevHandCenters[i] = centerPx;
      }

      // Remove extra prevCenters if hands decreased
      prevHandCenters = prevHandCenters.slice(0, hands.length);

      window.handData = {
        timestamp: now,
        hands,
        debug: {
          fpsHands: Math.round(frameRate()),
          hasCamera: cameraReady,
          errors: null
        }
      };
    }

    // ===========================================
    // CAMERA PREVIEW
    // ===========================================
    let camVideoEl, camOverlayEl, camCtx;

    function initializeCameraPreview(){
      camVideoEl = document.getElementById('camVideo');
      camOverlayEl = document.getElementById('camOverlay');
      camCtx = camOverlayEl.getContext('2d');

      function sync(){
        const w = camOverlayEl.clientWidth;
        const h = camOverlayEl.clientHeight;
        camOverlayEl.width = Math.floor(w * devicePixelRatio);
        camOverlayEl.height = Math.floor(h * devicePixelRatio);
        camCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
      }
      sync();
      window.addEventListener('resize', sync);
    }

    function drawHandPreview(){
      if(!camCtx || !camOverlayEl) return;
      const W = camOverlayEl.clientWidth;
      const H = camOverlayEl.clientHeight;
      camCtx.clearRect(0,0,W,H);

      const d = window.handData;
      if(!d || !d.hands || d.hands.length===0){
        camCtx.fillStyle = "rgba(255,255,255,.8)";
        camCtx.font = "12px Courier New";
        camCtx.fillText("No hands", 10, H-10);
        return;
      }

      const edges = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20],
        [5,9],[9,13],[13,17]
      ];

      // 用你隐藏的 webcam 尺寸映射
      const vw = document.getElementById("webcam").videoWidth || 640;
      const vh = document.getElementById("webcam").videoHeight || 480;
      const mirror = true;

      function mapPt(p){
        let x = (p.x / vw) * W;
        let y = (p.y / vh) * H;
        if(mirror) x = W - x;
        return {x,y};
      }

      for(const hand of d.hands){
        const kp = hand.keypointsCamPx;
        if(!kp || kp.length !== 21) continue;

        camCtx.strokeStyle = "rgba(255,255,255,.75)";
        camCtx.lineWidth = 1.2;
        camCtx.beginPath();
        for(const [a,b] of edges){
          const A = mapPt(kp[a]);
          const B = mapPt(kp[b]);
          camCtx.moveTo(A.x,A.y);
          camCtx.lineTo(B.x,B.y);
        }
        camCtx.stroke();

        camCtx.fillStyle = "rgba(255,200,220,.95)";
        for(let i=0;i<21;i++){
          const P = mapPt(kp[i]);
          camCtx.beginPath();
          camCtx.arc(P.x,P.y,2.2,0,Math.PI*2);
          camCtx.fill();
        }
      }
    }

    async function initMediaPipeHands() {
      try {
        // Check for HTTPS
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
          throw new Error('Camera requires HTTPS or localhost. Use a local server (e.g., VSCode Live Server)');
        }

        // Initialize Hands
        handsInstance = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        handsInstance.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });

        handsInstance.onResults(onHandResults);

        // Get webcam
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width:{ideal:1280}, height:{ideal:720}, facingMode:'user' },
          audio:false
        });

        const videoElement = document.getElementById('webcam');
        videoElement.srcObject = stream;
        await videoElement.play();

        const camVideo = document.getElementById("camVideo");
        if (camVideo) {
          camVideo.srcObject = stream;
          camVideo.muted = true;
          camVideo.setAttribute("muted", "");
          camVideo.setAttribute("playsinline", "");
          camVideo.onloadedmetadata = async () => {
            try { await camVideo.play(); }
            catch(e){ console.warn("camVideo autoplay blocked:", e); }
          };
        }

        cameraReady = true;

        // Start camera loop
        const camera = new Camera(videoElement, {
          onFrame: async () => {
            if (handsInstance) {
              await handsInstance.send({ image: videoElement });
            }
          },
          width: 1280,
          height: 720
        });
        camera.start();

        console.log('✅ MediaPipe Hands initialized successfully!');

      } catch (err) {
        console.error('❌ Failed to initialize MediaPipe Hands:', err);
        window.handData = {
          timestamp: performance.now(),
          hands: [],
          debug: {
            fpsHands: 0,
            hasCamera: false,
            errors: err.message
          }
        };
      }
    }

    // Initialize after page loads
    window.addEventListener('load', () => {
      setTimeout(initMediaPipeHands, 500);
    });

    window.addEventListener("pointerdown", async () => {
      const v = document.getElementById("camVideo");
      if (v && v.paused) { try { await v.play(); } catch(e){} }
    }, { once:true });

    // ===========================================
    // CLASSES
    // ===========================================
    class TreeBranch {
      constructor(x1, y1, x2, y2, depth) {
        this.x1 = x1; this.y1 = y1;
        this.x2 = x2; this.y2 = y2;
        this.depth = depth;
        this.length = dist(x1, y1, x2, y2);
      }
    }

    class Particle {
      constructor(x, y, size, isTree = true) {
        this.homeX = x; this.homeY = y;
        this.x = x; this.y = y;
        this.size = size;
        this.isTree = isTree;
        this.phase = random(TWO_PI);
        this.alpha = 1.0;

        if (!isTree) {
          this.vx = random(-CONFIG.DUST_SPEED, CONFIG.DUST_SPEED);
          this.vy = random(-CONFIG.DUST_SPEED, CONFIG.DUST_SPEED);
          this.alpha = random(0.2, 0.6);
        }
      }

      update() {
        if (this.isTree) {
          const breathe = sin(timeOffset * CONFIG.PULSE_SPEED + this.phase);
          this.alpha = map(breathe, -1, 1, 1 - CONFIG.PULSE_AMOUNT, 1);

          if (mouseFieldActive) {
            const dx = mouseX - this.homeX;
            const dy = mouseY - this.homeY;
            const distance = sqrt(dx * dx + dy * dy);

            if (distance < CONFIG.MOUSE_FIELD_RADIUS && distance > 0) {
              const force = (1 - distance / CONFIG.MOUSE_FIELD_RADIUS);
              const angle = atan2(dy, dx);
              const displacement = force * CONFIG.MOUSE_FIELD_STRENGTH;

              this.x = lerp(this.x, this.homeX - cos(angle) * displacement, 0.1);
              this.y = lerp(this.y, this.homeY - sin(angle) * displacement, 0.1);
            } else {
              this.x = lerp(this.x, this.homeX, 0.05);
              this.y = lerp(this.y, this.homeY, 0.05);
            }
          } else {
            this.x = lerp(this.x, this.homeX, 0.05);
            this.y = lerp(this.y, this.homeY, 0.05);
          }
        } else {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0) this.x = width;
          if (this.x > width) this.x = 0;
          if (this.y < 0) this.y = height;
          if (this.y > height) this.y = 0;
        }
      }

      draw() {
        if (this.isTree) {
          fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], this.alpha * 255);
        } else {
          fill(CONFIG.DUST_COLOR[0], CONFIG.DUST_COLOR[1], CONFIG.DUST_COLOR[2], this.alpha * 255);
        }
        noStroke();
        circle(this.x, this.y, this.size);
      }
    }

    class Portal {
      constructor(x, y, label, season) {
        this.x = x; this.y = y;
        this.label = label;
        this.season = season;
        this.radius = 50;
        this.hovered = false;
        this.glowParticles = [];
        this.pulse = 0;
      }

      update() {
        const d = dist(mouseX, mouseY, this.x, this.y);
        this.hovered = d < this.radius;
        this.pulse += 0.05;

        if (this.hovered && frameCount % 3 === 0) {
          const angle = random(TWO_PI);
          const r = random(this.radius * 0.8, this.radius * 1.2);
          this.glowParticles.push({
            x: this.x + cos(angle) * r,
            y: this.y + sin(angle) * r,
            vx: cos(angle) * 0.5,
            vy: sin(angle) * 0.5,
            life: 1.0,
            size: random(2, 4),
          });
        }

        for (let i = this.glowParticles.length - 1; i >= 0; i--) {
          let p = this.glowParticles[i];
          p.x += p.vx; p.y += p.vy;
          p.life -= 0.02;
          if (p.life <= 0) this.glowParticles.splice(i, 1);
        }
      }

      draw() {
        push();

        for (let gp of this.glowParticles) {
          fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], gp.life * 200);
          noStroke();
          circle(gp.x, gp.y, gp.size);
        }

        noFill();
        const brightness = this.hovered ? 255 : 150;
        const pulseOffset = sin(this.pulse) * 3;

        stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], brightness);
        strokeWeight(2);
        circle(this.x, this.y, this.radius * 2 + pulseOffset);

        if (this.hovered) {
          stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 100);
          strokeWeight(1);
          circle(this.x, this.y, this.radius * 2.2);
        }

        fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], brightness);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(14);
        text(this.label, this.x, this.y);

        pop();
      }

      click() { if (this.hovered) setState(this.season); }
    }

    // ===========================================
    // GENERATORS
    // ===========================================
    function generateTreePoints() {
      const branches = [];
      const particles = [];
      const trunkBase = { x: width / 2, y: height * 0.85 };
      const trunkTop  = { x: width / 2, y: height * 0.45 };

      function createBranch(x1, y1, angle, length, depth) {
        if (depth > 7 || length < 8) return;
        const x2 = x1 + cos(angle) * length;
        const y2 = y1 + sin(angle) * length;

        branches.push(new TreeBranch(x1, y1, x2, y2, depth));

        const angleVar = random(0.3, 0.5);
        const lengthReduce = random(0.65, 0.75);

        createBranch(x2, y2, angle - angleVar, length * lengthReduce, depth + 1);
        createBranch(x2, y2, angle + angleVar, length * lengthReduce, depth + 1);

        if (random() > 0.7 && depth < 5) {
          createBranch(x2, y2, angle + random(-0.2, 0.2), length * lengthReduce * 0.8, depth + 1);
        }
      }

      branches.push(new TreeBranch(trunkBase.x, trunkBase.y, trunkTop.x, trunkTop.y, 0));
      createBranch(trunkTop.x, trunkTop.y, -PI / 2, 80, 1);

      const pointsPerBranch = Math.floor(CONFIG.TREE_PARTICLE_COUNT / branches.length);

      for (let b of branches) {
        const density = map(b.depth, 0, 7, 0.5, 1.5);
        const numPoints = Math.floor(pointsPerBranch * density);

        for (let i = 0; i < numPoints; i++) {
          const t = i / numPoints;
          const x = lerp(b.x1, b.x2, t) + random(-3, 3);
          const y = lerp(b.y1, b.y2, t) + random(-3, 3);

          const size = map(b.depth, 0, 7, CONFIG.PARTICLE_SIZE_MAX, CONFIG.PARTICLE_SIZE_MIN);
          particles.push(new Particle(x, y, size + random(-0.5, 0.5), true));
        }
      }
      return particles;
    }

    function generateDustParticles() {
      const dust = [];
      for (let i = 0; i < CONFIG.DUST_COUNT; i++) {
        dust.push(new Particle(random(width), random(height), random(1, 2.5), false));
      }
      return dust;
    }

    function generateConnections() {
      const out = [];
      const gridSize = CONFIG.CONNECTION_DISTANCE;
      const grid = {};

      for (let p of treeParticles) {
        const gx = Math.floor(p.homeX / gridSize);
        const gy = Math.floor(p.homeY / gridSize);
        const key = `${gx},${gy}`;
        (grid[key] ||= []).push(p);
      }

      for (let p1 of treeParticles) {
        if (out.length >= CONFIG.CONNECTION_COUNT) break;
        const gx = Math.floor(p1.homeX / gridSize);
        const gy = Math.floor(p1.homeY / gridSize);

        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const key = `${gx + dx},${gy + dy}`;
            const neighbors = grid[key] || [];
            for (let p2 of neighbors) {
              if (p1 === p2) continue;
              const d = dist(p1.homeX, p1.homeY, p2.homeX, p2.homeY);
              if (d < CONFIG.CONNECTION_DISTANCE) {
                out.push({ p1, p2, dist: d });
                if (out.length >= CONFIG.CONNECTION_COUNT) return out;
              }
            }
          }
        }
      }
      return out;
    }

    function setupPortals() {
      const centerX = width / 2;
      const centerY = height * 0.6;
      const radius = Math.min(width, height) * 0.4;
      return [
        new Portal(centerX - radius, centerY - radius * 0.3, "SPRING", "spring"),
        new Portal(centerX + radius, centerY - radius * 0.3, "SUMMER", "summer"),
        new Portal(centerX - radius, centerY + radius * 0.5, "AUTUMN", "autumn"),
        new Portal(centerX + radius, centerY + radius * 0.5, "WINTER", "winter"),
      ];
    }

    function updateHubParticles() {
      for (let p of treeParticles) p.update();
      for (let p of dustParticles) p.update();
      for (let portal of portals) portal.update();
      timeOffset++;
    }

    function drawHubTree() {
      stroke(CONFIG.CONNECTION_COLOR[0], CONFIG.CONNECTION_COLOR[1], CONFIG.CONNECTION_COLOR[2], CONFIG.CONNECTION_ALPHA * 255);
      strokeWeight(0.5);

      for (let conn of connections) {
        const a = map(conn.dist, 0, CONFIG.CONNECTION_DISTANCE, CONFIG.CONNECTION_ALPHA, 0);
        stroke(CONFIG.CONNECTION_COLOR[0], CONFIG.CONNECTION_COLOR[1], CONFIG.CONNECTION_COLOR[2], a * 255);
        line(conn.p1.x, conn.p1.y, conn.p2.x, conn.p2.y);
      }
      for (let p of treeParticles) p.draw();
    }

    function handleHubMouseField() {
      mouseFieldActive = (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height);
    }

    // ===========================================
    // ROOM STATE
    // ===========================================
    let springBgGfx = null;
    let springCanopyPts = null;

    let roomState = {
      spring: {
        airPetals: [],
        groundPetals: [],
        wind: {x:0,y:0,strength:0},
        windActive:false,
        stillFrames:0,
        ambientParticles: [],
        prevMouseX:0, prevMouseY:0
      },
      summer: { ambientParticles: [], gfx: null, cols: 160, rows: 90, t: 0 },
      autumn: { apples: [], basket: null, ambientParticles: [] },
      winter: { snowParticles: [], traces: [], ambientParticles: [] },
    };

    function initializeRoom(room) {
      console.log(`Initializing ${room} room...`);
      if (room === "spring") initializeSpring();
      if (room === "summer") initializeSummer();
      if (room === "autumn") initializeAutumn();
      if (room === "winter") initializeWinter();
    }

    // ===========================================
    // UI / FX
    // ===========================================
    function drawTechGrid(spacing = 50, opacity = 12) {
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], opacity);
      strokeWeight(0.5);
      for (let x = 0; x <= width; x += spacing) line(x, 0, x, height);
      for (let y = 0; y <= height; y += spacing) line(0, y, width, y);
    }

    function drawSoftVignette() {
      const band = 140;
      noStroke();
      for (let i = 0; i < band; i += 6) {
        const a = map(i, 0, band, 0, 120);
        fill(0, 0, 0, a * 0.25);
        rect(0, i, width, 6);
        rect(0, height - i - 6, width, 6);
        rect(i, 0, 6, height);
        rect(width - i - 6, 0, 6, height);
      }
    }

    function drawStageBoundary() {
      const stageWidth = width * 0.7;
      const stageHeight = height * 0.6;
      const stageX = (width - stageWidth) / 2;
      const stageY = (height - stageHeight) / 2 + 40;

      push();
      noFill();
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 80);
      strokeWeight(1);
      rect(stageX, stageY, stageWidth, stageHeight);

      const c = 15;
      strokeWeight(2);
      line(stageX, stageY, stageX + c, stageY);
      line(stageX, stageY, stageX, stageY + c);
      line(stageX + stageWidth, stageY, stageX + stageWidth - c, stageY);
      line(stageX + stageWidth, stageY, stageX + stageWidth, stageY + c);
      line(stageX, stageY + stageHeight, stageX + c, stageY + stageHeight);
      line(stageX, stageY + stageHeight, stageX, stageY + stageHeight - c);
      line(stageX + stageWidth, stageY + stageHeight, stageX + stageWidth - c, stageY + stageHeight);
      line(stageX + stageWidth, stageY + stageHeight, stageX + stageWidth, stageY + stageHeight - c);
      pop();
    }

    function generateAmbientParticles(count=30){
      const ps=[];
      for(let i=0;i<count;i++){
        ps.push({ x:random(width), y:random(height), vx:random(-0.2,0.2), vy:random(-0.2,0.2), size:random(1,2), alpha:random(0.1,0.3), phase:random(TWO_PI) });
      }
      return ps;
    }
    function updateAmbientParticles(ps){
      for(let p of ps){
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0) p.x=width; if(p.x>width) p.x=0;
        if(p.y<0) p.y=height; if(p.y>height) p.y=0;
        p.alpha = 0.2 + sin(frameCount*0.02 + p.phase)*0.1;
      }
    }
    function drawAmbientParticles(ps){
      noStroke();
      for(let p of ps){
        fill(CONFIG.PARTICLE_COLOR[0],CONFIG.PARTICLE_COLOR[1],CONFIG.PARTICLE_COLOR[2], p.alpha*255);
        circle(p.x,p.y,p.size);
      }
    }

    // ===========================================
    // SPRING (Hand velocity → wind)
    // ===========================================
    function initializeSpring() {
      roomState.spring.airPetals = [];
      roomState.spring.groundPetals = [];
      roomState.spring.wind = { x: 0, y: 0, strength: 0 };
      roomState.spring.windActive = false;
      roomState.spring.stillFrames = 0;

      // 默认不生成会掉落的花瓣（静止状态只画"树冠花团"）
      for (let i = 0; i < 40; i++) spawnSpringPetal(true);

      roomState.spring.ambientParticles = generateAmbientParticles(12);

      buildSpringBackground();   // 背景贴图
      buildSpringCanopy();       // 樱花树冠点阵（固定，不闪）
    }

    function spawnSpringPetal(frozen=false) {
      const treeX = width / 2;
      const treeCanopyY = height * 0.38;

      const px = treeX + random(-220, 220);
      const py = treeCanopyY + random(-140, 60);

      roomState.spring.airPetals.push({
        x: px, y: py,
        vx: frozen ? 0 : random(-0.2, 0.2),
        vy: frozen ? 0 : random(0.1, 0.4),
        rot: random(TWO_PI),
        rotSpeed: frozen ? 0 : random(-0.05, 0.05),
        size: random(4, 10),
        drift: 0,
        life: 1.0,

        // 更接近真实樱花：更柔、更淡
        color: [255, random(210, 235), random(220, 245)],
        alpha: random(140, 220),

        // depth：用于远近/模糊/亮度（假景深）
        depth: random(0, 1)
      });
    }

    function updateSpring() {
      const s = roomState.spring;

      // 只用手势，不用鼠标兜底
      const hasHand = window.handData && window.handData.hands.length > 0;

      // deadzone + hysteresis（避免微抖导致误判有风）
      const DEAD_SPEED_ON  = 3.2;  // 超过这个才算"开始有风"
      const DEAD_SPEED_OFF = 2.0;  // 低于这个持续几帧才算"停风"
      const OFF_HOLD_FRAMES = 10;  // 需要连续静止多少帧才关风

      let targetWindX = 0, targetWindY = 0, targetStrength = 0;

      if (hasHand) {
        const hand = window.handData.hands[0];
        const vx = hand.velocity.x;
        const vy = hand.velocity.y;
        const sp = hand.velocity.speed;

        if (sp > DEAD_SPEED_ON) {
          s.windActive = true;
          s.stillFrames = 0;

          // 风向跟手一致：手往哪挥 wind 往哪吹
          const GAIN = 1.8;
          targetWindX = vx * GAIN;
          targetWindY = vy * GAIN;

          // 强度
          targetStrength = constrain((sp - DEAD_SPEED_ON) / 18, 0, 1);
        } else {
          // 低速：累积静止帧，达到阈值才真正关风
          s.stillFrames++;
          if (s.windActive && (sp < DEAD_SPEED_OFF) && s.stillFrames >= OFF_HOLD_FRAMES) {
            s.windActive = false;
          }
        }
      } else {
        // 没检测到手：直接无风
        s.windActive = false;
        s.stillFrames = 0;
      }

      // 平滑 wind 值（但如果关风了，要快速归零）
      if (!s.windActive) {
        s.wind.x = 0;
        s.wind.y = 0;
        s.wind.strength = 0;
      } else {
        s.wind.x = lerp(s.wind.x, targetWindX, 0.25);
        s.wind.y = lerp(s.wind.y, targetWindY, 0.25);
        s.wind.strength = lerp(s.wind.strength, targetStrength, 0.20);
      }

      // ✅ 无风：花瓣"1 像素都不动"（硬冻结）
      if (!s.windActive || s.wind.strength < 0.02) {
        // 完全冻结：不要更新位置/速度/旋转，也不要加随机扰动
        updateAmbientParticles(s.ambientParticles);
        return;
      }

      // ✅ 有风：才允许生成/下落/受风影响
      const groundY = height * 0.72;

      // 有风时补充一些空中花瓣（模拟被吹落/卷起）
      const maxAirPetals = 220;
      if (s.airPetals.length < maxAirPetals && frameCount % 2 === 0) spawnSpringPetal(false);

      const influenceX = window.handData?.hands?.[0]?.center?.x ?? width/2;
      const influenceY = window.handData?.hands?.[0]?.center?.y ?? height/2;
      const windInfluenceRadius = 220;

      for (let i = s.airPetals.length - 1; i >= 0; i--) {
        const p = s.airPetals[i];

        // 重力（有风才会掉）
        p.vy += 0.07;

        // 风场：离手近风更强
        const dx = influenceX - p.x;
        const dy = influenceY - p.y;
        const d = sqrt(dx*dx + dy*dy);

        if (d < windInfluenceRadius) {
          const k = (1 - d / windInfluenceRadius) * s.wind.strength;
          p.vx += s.wind.x * k * 0.035;
          p.vy += s.wind.y * k * 0.035;
        } else {
          // 全局风（弱一点）
          p.vx += s.wind.x * s.wind.strength * 0.002;
          p.vy += s.wind.y * s.wind.strength * 0.002;
        }

        // 少量空气阻尼（真实一点）
        p.vx *= 0.985;
        p.vy *= 0.992;

        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;

        // 落地
        if (p.y >= groundY) {
          s.groundPetals.push({
            x: p.x,
            y: groundY + random(-1, 6),
            rot: p.rot,
            size: p.size * random(0.85, 1.15),
            alpha: 0.85,
            color: p.color
          });
          s.airPetals.splice(i, 1);

          if (s.groundPetals.length > 2500) {
            s.groundPetals.splice(0, Math.floor(s.groundPetals.length * 0.12));
          }
          continue;
        }

        // 环绕
        if (p.x < -40) p.x = width + 40;
        if (p.x > width + 40) p.x = -40;
        if (p.y < -80) p.y = -80;
      }

      // 有风时地面花瓣才会轻微滚动
      for (let gp of s.groundPetals) {
        if (random() > 0.992) gp.x += s.wind.x * 0.02 * random(0.4, 1.0);
      }

      updateAmbientParticles(s.ambientParticles);
    }

    function drawSpring() {
      const s = roomState.spring;

      // 背景：天空 + 远景树林 + 湖
      if (springBgGfx) image(springBgGfx, 0, 0, width, height);

      // 地面
      noStroke();
      fill(120, 150, 120, 210);
      rect(0, height * 0.72, width, height * 0.28);

      // 地面花瓣
      for (let gp of s.groundPetals) {
        push();
        translate(gp.x, gp.y);
        rotate(gp.rot);
        fill(255, 220, 235, gp.alpha * 170);
        noStroke();
        ellipse(0, 0, gp.size * 0.9, gp.size * 1.4);
        pop();
      }

      // 樱花树（更有体量）
      drawCherryTreeBody();

      // 固定树冠点（不闪）
      if (springCanopyPts){
        noStroke();
        for(const p of springCanopyPts){
          fill(p.col[0], p.col[1], p.col[2], p.alpha);
          circle(p.x, p.y, p.sz);
          if(p.hl){
            fill(255,255,255,150);
            circle(p.x + p.ox, p.y + p.oy, p.sz*0.75);
          }
        }
      }

      // 空中花瓣（只有有风时才会动；无风时 updateSpring 已经硬冻结）
      for (let p of s.airPetals) {
        push();
        translate(p.x, p.y);
        rotate(p.rot);

        // depth：远处更小更淡
        const k = lerp(0.65, 1.15, 1 - p.depth);
        const a = lerp(90, 220, 1 - p.depth);

        fill(p.color[0], p.color[1], p.color[2], a);
        noStroke();
        ellipse(0, 0, p.size * 0.9 * k, p.size * 1.5 * k);
        pop();
      }

      // 柔光/雾感
      drawSoftVignette();

      // 顶部信息
      const windBar = Math.floor(s.wind.strength * 20);
      const windBarStr = "█".repeat(windBar) + "░".repeat(20 - windBar);
      drawTopBar("SPRING ENVIRONMENT", `WIND: ${windBarStr}`);
      drawInstructionPanel("HAND GESTURE", "Wave your hand to create wind and blow petals.");
    }

    // Spring helper functions
    function drawSpringScenery(){
      // Sky gradient
      for (let y = 0; y < height; y++) {
        const t = y / height;
        const c = lerpColor(color(195, 220, 245), color(240, 245, 250), t);
        stroke(c);
        line(0, y, width, y);
      }

      // Distant trees band
      noStroke();
      fill(30, 55, 45, 170);
      rect(0, height*0.42, width, height*0.06);
      for(let i=0;i<120;i++){
        const x = (i/120)*width;
        const h = random(height*0.03, height*0.10);
        fill(20, 45, 35, 160);
        rect(x, height*0.42 - h, random(8,22), h);
      }

      // Lake
      for (let y = Math.floor(height*0.48); y < Math.floor(height*0.72); y++) {
        const t = (y - height*0.48) / (height*0.24);
        const c = lerpColor(color(150, 175, 185), color(120, 150, 160), t);
        stroke(c);
        line(0, y, width, y);
      }

      // subtle water ripples
      noFill();
      stroke(255,255,255,22);
      for(let i=0;i<14;i++){
        const yy = height*0.52 + i*random(8,16);
        beginShape();
        for(let x=0;x<=width;x+=30){
          vertex(x, yy + sin((x*0.01)+frameCount*0.02+i)*2);
        }
        endShape();
      }
    }

    function drawCherryTreeBody(){
      const treeX = width * 0.36;
      const baseY = height * 0.72;
      const topY  = height * 0.30;

      // trunk shading
      noStroke();
      for(let i=0;i<16;i++){
        const t = i/15;
        fill(55 + t*20, 40 + t*18, 35 + t*14, 220);
        const w = lerp(74, 26, t);
        rect(treeX - w/2, lerp(baseY, topY, t), w, (baseY-topY)/16 + 2, 18);
      }

      // main branches
      stroke(70,55,45,220);
      strokeWeight(10);
      noFill();
      bezier(treeX, topY+40, treeX-40, topY+70, treeX-90, topY+120, treeX-160, topY+170);
      bezier(treeX, topY+40, treeX+60, topY+80, treeX+130, topY+130, treeX+220, topY+160);

      strokeWeight(7);
      bezier(treeX-10, topY+70, treeX-40, topY+90, treeX-80, topY+110, treeX-120, topY+140);
      bezier(treeX+20, topY+80, treeX+70, topY+95, treeX+120, topY+120, treeX+160, topY+140);
    }

    function drawCherryCanopyClusters(){
      // 用"花团"堆体量（像照片那样一大团粉色）
      const cx = width*0.55;
      const cy = height*0.36;

      // 大团 + 边缘小团
      const clusters = [
        {x:cx-180,y:cy-40,r:170},
        {x:cx-40, y:cy-80,r:190},
        {x:cx+130,y:cy-30,r:200},
        {x:cx+250,y:cy+30,r:170},
        {x:cx+60, y:cy+70,r:210},
        {x:cx-110,y:cy+80,r:190},
      ];

      noStroke();
      for(const c of clusters){
        for(let i=0;i<420;i++){
          const a = random(TWO_PI);
          const rr = pow(random(), 0.55) * c.r;
          const x = c.x + cos(a)*rr;
          const y = c.y + sin(a)*rr*0.75;

          // 颜色：淡粉到偏白
          const p = random();
          const col = p < 0.55 ? color(255, 235, 245, 135) : color(255, 220, 235, 155);
          fill(col);

          const sz = random(2.2, 5.5);
          circle(x, y, sz);

          // 少量高光点（像阳光打在花上）
          if (random() > 0.985) {
            fill(255,255,255,160);
            circle(x+random(-2,2), y+random(-2,2), sz*0.8);
          }
        }
      }

      // 轻雾（让边缘更柔）
      fill(255,255,255,18);
      rect(0,0,width,height);
    }

    function buildSpringBackground(){
      springBgGfx = createGraphics(windowWidth, windowHeight);
      const g = springBgGfx;

      // 1) sky
      for(let y=0;y<g.height;y++){
        const t = y/g.height;
        const c = lerpColor(color(210,230,245), color(245,250,255), t);
        g.stroke(c);
        g.line(0,y,g.width,y);
      }

      // 2) far forest (noise skyline)
      g.noStroke();
      const horizonY = g.height*0.42;
      g.fill(35,60,50,220);
      g.rect(0, horizonY, g.width, g.height*0.08);

      g.fill(25,45,38,220);
      for(let x=0;x<g.width;x+=10){
        const n = noise(x*0.01);
        const h = 40 + n*110;
        g.rect(x, horizonY - h, 12, h);
      }

      // 3) lake gradient
      const lakeTop = g.height*0.50;
      const lakeBot = g.height*0.72;
      for(let y=Math.floor(lakeTop); y<Math.floor(lakeBot); y++){
        const t = (y-lakeTop)/(lakeBot-lakeTop);
        const c = lerpColor(color(165,185,190), color(125,155,165), t);
        g.stroke(c);
        g.line(0,y,g.width,y);
      }

      // 4) subtle horizontal ripples (固定，不抖)
      g.noFill();
      g.stroke(255,255,255,18);
      for(let i=0;i<18;i++){
        const yy = lakeTop + i*12;
        g.beginShape();
        for(let x=0;x<=g.width;x+=28){
          const w = sin(x*0.012 + i*0.6)*1.6;
          g.vertex(x, yy + w);
        }
        g.endShape();
      }

      // 5) soft haze
      g.noStroke();
      g.fill(255,255,255,22);
      g.rect(0,0,g.width,g.height);
    }

    function buildSpringCanopy(){
      // 生成一次：固定花团点，不闪
      springCanopyPts = [];
      const cx = width*0.58;
      const cy = height*0.34;

      const clusters = [
        {x:cx-180,y:cy-35,r:170},
        {x:cx-40, y:cy-80,r:190},
        {x:cx+140,y:cy-35,r:205},
        {x:cx+260,y:cy+35,r:175},
        {x:cx+70, y:cy+85,r:215},
        {x:cx-120,y:cy+85,r:190},
      ];

      for(const c of clusters){
        for(let i=0;i<520;i++){
          const a = random(TWO_PI);
          const rr = pow(random(), 0.58) * c.r;
          const x = c.x + cos(a)*rr;
          const y = c.y + sin(a)*rr*0.72;

          const whiteBias = random();
          const col = whiteBias < 0.55 ? [255,235,245] : [255,220,235];
          const alpha = whiteBias < 0.55 ? random(90,150) : random(110,175);
          const sz = random(2.2, 5.8);

          const ox = random(-1.2, 1.2);
          const oy = random(-1.2, 1.2);
          springCanopyPts.push({x,y,sz,col,alpha,hl: random()>0.985, ox, oy});
        }
      }
    }

    // ===========================================
    // SUMMER (Hand distance → wave amplitude, hand position → disturbance)
    // ===========================================
    function initializeSummer() {
      roomState.summer.ambientParticles = generateAmbientParticles(30);
      roomState.summer.t = 0;
      roomState.summer.gfx = createGraphics(windowWidth, windowHeight, WEBGL);
      roomState.summer.gfx.pixelDensity(1);
      roomState.summer.gfx.noFill();
    }

    function updateSummer() {
      roomState.summer.t += 0.012;
      updateAmbientParticles(roomState.summer.ambientParticles);
    }

    function drawSummer() {
      for (let i = 0; i < height; i++) {
        const inter = map(i, 0, height, 0, 1);
        const c = lerpColor(color(120, 190, 255), color(10, 25, 50), inter);
        stroke(c); line(0, i, width, i);
      }

      drawTechGrid(70, 10);
      drawAmbientParticles(roomState.summer.ambientParticles);
      drawStageBoundary();

      const g = roomState.summer.gfx;
      if (g) {
        g.clear();
        g.background(0, 0, 0, 0);
        g.push();

        g.rotateX(-0.75);
        g.translate(0, 120, 0);

        const cols = 170;
        const rows = 110;
        const sx = width / cols;
        const sy = height / rows;

        // Hand gesture influence
        let mx = map(mouseX, 0, width, -1, 1);
        let my = map(mouseY, 0, height, -1, 1);
        let waveAmplitude = 1.0;

        if (window.handData && window.handData.hands.length > 0) {
          const hand = window.handData.hands[0];
          mx = map(hand.center.x, 0, width, -1, 1);
          my = map(hand.center.y, 0, height, -1, 1);

          if (window.handData.hands.length === 2) {
            const h1 = window.handData.hands[0];
            const h2 = window.handData.hands[1];
            const dx = h1.center.x - h2.center.x;
            const dy = h1.center.y - h2.center.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            waveAmplitude = map(dist, 80, 520, 0.3, 4.0, true);
          }
        }

        g.stroke(170, 220, 255, 85);
        g.strokeWeight(1);

        for (let y = 0; y < rows; y += 2) {
          g.beginShape();
          for (let x = 0; x < cols; x++) {
            const nx = x / cols;
            const ny = y / rows;

            const w1 = sin((nx * 7.0) + roomState.summer.t * 2.0);
            const w2 = cos((ny * 6.0) + roomState.summer.t * 1.6);
            let z = (w1 + w2) * 18 * waveAmplitude;

            z += (noise(nx * 2.2, ny * 2.2, roomState.summer.t) - 0.5) * 35 * waveAmplitude;

            const dx = (nx * 2 - 1) - mx;
            const dy = (ny * 2 - 1) - my;
            const d = sqrt(dx*dx + dy*dy);
            z += max(0, 1 - d * 1.2) * 140;

            const px = (x - cols / 2) * sx;
            const py = (y - rows / 2) * sy;

            g.vertex(px, py, z);
          }
          g.endShape();
        }

        g.stroke(200, 240, 255, 110);
        g.strokeWeight(2);
        for (let i = 0; i < 1200; i++) {
          const x = (i % cols);
          const y = Math.floor(i / cols) % rows;
          const nx = x / cols;
          const ny = y / rows;
          const w = sin((nx * 7.0) + roomState.summer.t * 2.0) + cos((ny * 6.0) + roomState.summer.t * 1.6);
          const z = w * 14 * waveAmplitude + (noise(nx * 2.2, ny * 2.2, roomState.summer.t) - 0.5) * 28 * waveAmplitude;
          const px = (x - cols / 2) * sx;
          const py = (y - rows / 2) * sy;
          if (random() < 0.22) g.point(px, py, z);
        }

        g.pop();
        image(g, 0, 0, width, height);
      }

      drawSoftVignette();

      let gestureStatus = "MOUSE FALLBACK";
      if (window.handData && window.handData.hands.length === 2) {
        gestureStatus = "DUAL HAND: WAVE AMPLITUDE CONTROL";
      } else if (window.handData && window.handData.hands.length === 1) {
        gestureStatus = "SINGLE HAND: LOCAL DISTURBANCE";
      }

      drawTopBar("SUMMER ENVIRONMENT", gestureStatus);
      drawInstructionPanel("HAND GESTURE", "Use two hands to control wave amplitude. One hand creates local disturbance.");
    }

    // ===========================================
    // AUTUMN (Pinch gesture → pick apples)
    // ===========================================
    function initializeAutumn() {
      roomState.autumn.apples = [];
      roomState.autumn.basket = { x: width / 2, y: height * 0.8, width: 100, height: 40 };

      for (let i = 0; i < 15; i++) {
        roomState.autumn.apples.push({
          x: width / 2 + random(-150, 150),
          y: height * 0.35 + random(0, 150),
          size: random(20, 30),
          picked: false,
          falling: false,
          vy: 0,
        });
      }
      roomState.autumn.ambientParticles = generateAmbientParticles(30);
    }

    function updateAutumn() {
      // Pinch gesture → pick nearest apple
      if (window.handData && window.handData.hands.length > 0) {
        const hand = window.handData.hands[0];
        if (hand.pinch.isPinching) {
          let nearest = null;
          let minDist = Infinity;
          for (let apple of roomState.autumn.apples) {
            if (!apple.picked && !apple.falling) {
              const d = dist(hand.center.x, hand.center.y, apple.x, apple.y);
              if (d < minDist && d < 140) {
                minDist = d;
                nearest = apple;
              }
            }
          }
          if (nearest) nearest.falling = true;
        }
      }

      for (let apple of roomState.autumn.apples) {
        if (apple.falling) {
          apple.vy += 0.5;
          apple.y += apple.vy;

          if (apple.y >= roomState.autumn.basket.y &&
              apple.x >= roomState.autumn.basket.x - roomState.autumn.basket.width / 2 &&
              apple.x <= roomState.autumn.basket.x + roomState.autumn.basket.width / 2) {
            apple.picked = true;
            apple.falling = false;
          }
          if (apple.y > height + 50) {
            apple.falling = false;
            apple.y = -1000;
          }
        }
      }
      updateAmbientParticles(roomState.autumn.ambientParticles);
    }

    function drawAutumn() {
      for (let i = 0; i < height; i++) {
        const inter = map(i, 0, height, 0, 1);
        const c = lerpColor(color(255, 200, 150), color(200, 120, 80), inter);
        stroke(c); line(0, i, width, i);
      }

      drawTechGrid(65, 8);
      drawAmbientParticles(roomState.autumn.ambientParticles);
      drawStageBoundary();

      fill(160, 100, 60, 120); noStroke();
      rect(0, height * 0.7, width, height * 0.3);

      fill(100, 60, 40, 150);
      rect(width / 2 - 20, height * 0.35, 40, height * 0.35);
      ellipse(width / 2, height * 0.4, 280, 180);

      fill(160, 120, 80);
      stroke(100, 70, 50); strokeWeight(2);
      rect(roomState.autumn.basket.x - roomState.autumn.basket.width / 2,
           roomState.autumn.basket.y,
           roomState.autumn.basket.width,
           roomState.autumn.basket.height, 5);

      noStroke();
      for (let apple of roomState.autumn.apples) {
        if (!apple.picked && apple.y > -100) {
          fill(220, 50, 50);
          circle(apple.x, apple.y, apple.size);
          stroke(100, 60, 40); strokeWeight(2);
          line(apple.x, apple.y - apple.size / 2, apple.x, apple.y - apple.size / 2 - 5);
        }
      }

      // Hand pinch visualization
      if (window.handData && window.handData.hands.length > 0) {
        const hand = window.handData.hands[0];
        push();
        noFill();
        stroke(100, 200, 255, hand.pinch.value * 200);
        strokeWeight(3);
        circle(hand.center.x, hand.center.y, 60);
        pop();
      }

      drawSoftVignette();

      let gestureStatus = "MOUSE FALLBACK";
      if (window.handData && window.handData.hands.length > 0) {
        const hand = window.handData.hands[0];
        gestureStatus = hand.pinch.isPinching ? "PINCHING: HARVESTING" : "HAND DETECTED: PINCH TO PICK";
      }

      drawTopBar("AUTUMN ENVIRONMENT", gestureStatus);
      drawInstructionPanel("HAND GESTURE", "Pinch near an apple to make it fall into the basket.");
    }

    // ===========================================
    // WINTER (Dual hand movement → trace intensity)
    // ===========================================
    function initializeWinter() {
      roomState.winter.snowParticles = [];
      roomState.winter.traces = [];
      for (let i = 0; i < 150; i++) {
        roomState.winter.snowParticles.push({
          x: random(width),
          y: random(height),
          vx: random(-0.3, 0.3),
          vy: random(0.5, 1.5),
          size: random(2, 6),
        });
      }
      roomState.winter.ambientParticles = generateAmbientParticles(30);
    }

    function updateWinter() {
      for (let snow of roomState.winter.snowParticles) {
        snow.x += snow.vx;
        snow.y += snow.vy;
        if (snow.y > height) { snow.y = -10; snow.x = random(width); }
        if (snow.x < 0) snow.x = width;
        if (snow.x > width) snow.x = 0;
      }

      // Hand gesture → traces
      if (window.handData && window.handData.hands.length > 0) {
        for (let hand of window.handData.hands) {
          if (hand.velocity.speed > 3) {
            const intensity = Math.min(1, hand.velocity.speed / 30);
            for (let i = 0; i < Math.floor(intensity * 14); i++) {
              roomState.winter.traces.push({
                x: hand.center.x + random(-10, 10),
                y: hand.center.y + random(-10, 10),
                life: intensity
              });
            }
          }
        }
      } else if (mouseIsPressed) {
        roomState.winter.traces.push({ x: mouseX, y: mouseY, life: 1.0 });
      }

      for (let i = roomState.winter.traces.length - 1; i >= 0; i--) {
        roomState.winter.traces[i].life -= 0.01;
        if (roomState.winter.traces[i].life <= 0) roomState.winter.traces.splice(i, 1);
      }

      updateAmbientParticles(roomState.winter.ambientParticles);
    }

    function drawWinter() {
      for (let i = 0; i < height; i++) {
        const inter = map(i, 0, height, 0, 1);
        const c = lerpColor(color(200, 220, 240), color(240, 250, 255), inter);
        stroke(c); line(0, i, width, i);
      }

      drawTechGrid(55, 8);
      drawAmbientParticles(roomState.winter.ambientParticles);
      drawStageBoundary();

      fill(240, 245, 255, 150); noStroke();
      rect(0, height * 0.7, width, height * 0.3);

      for (let tr of roomState.winter.traces) {
        fill(150, 200, 255, tr.life * 150);
        noStroke();
        circle(tr.x, tr.y, 32);
      }

      fill(255, 255, 255, 180); noStroke();
      for (let snow of roomState.winter.snowParticles) circle(snow.x, snow.y, snow.size);

      fill(255, 255, 255, 200);
      stroke(200, 220, 240); strokeWeight(2);
      circle(width / 2, height * 0.5, 70);
      circle(width / 2, height * 0.6, 90);

      drawSoftVignette();

      let gestureStatus = "MOUSE FALLBACK";
      if (window.handData && window.handData.hands.length > 0) {
        gestureStatus = `HANDS: ${window.handData.hands.length} | SCULPTING SNOW`;
      }

      drawTopBar("WINTER ENVIRONMENT", gestureStatus);
      drawInstructionPanel("HAND GESTURE", "Move your hands to sculpt snow particles and create traces.");
    }

    // ===========================================
    // P5 MAIN
    // ===========================================
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.elt.style.position = "fixed";
      canvas.elt.style.left = "0";
      canvas.elt.style.top = "0";
      canvas.elt.style.zIndex = "0";

      treeParticles = generateTreePoints();
      dustParticles = generateDustParticles();
      connections = generateConnections();
      portals = setupPortals();

      const backButton = document.getElementById("backButton");
      backButton.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        setState("hub");
        return false;
      }, true);

      window.setState = setState;

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && currentState !== "hub") setState("hub");
      });

      initializeCameraPreview();

      console.log("✅ Hub initialized successfully!");
    }

    function draw() {
      if (currentState === "hub") {
        drawHub();
      } else if (currentState === "spring") {
        updateSpring(); drawSpring();
      } else if (currentState === "summer") {
        updateSummer(); drawSummer();
      } else if (currentState === "autumn") {
        updateAutumn(); drawAutumn();
      } else if (currentState === "winter") {
        updateWinter(); drawWinter();
      }

      drawHandPreview();
    }

    function drawHub() {
      background(0, 0, 0, 25);
      for (let p of dustParticles) p.draw();
      updateHubParticles();
      handleHubMouseField();
      drawHubTree();
      for (let portal of portals) portal.draw();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      treeParticles = generateTreePoints();
      connections = generateConnections();
      portals = setupPortals();

      if (roomState.summer.gfx) {
        roomState.summer.gfx.resizeCanvas(windowWidth, windowHeight);
      }

      if (currentState === "spring") {
        buildSpringBackground();
        buildSpringCanopy();
      }
    }

    function mouseClicked(event) {
      if (event && event.target && event.target.id === "backButton") return false;

      if (currentState === "hub") {
        for (let portal of portals) portal.click();
      } else if (currentState === "autumn") {
        // Mouse fallback for autumn
        for (let apple of roomState.autumn.apples) {
          if (!apple.picked && !apple.falling) {
            const d = dist(mouseX, mouseY, apple.x, apple.y);
            if (d < apple.size / 2) apple.falling = true;
          }
        }
      }
    }

    function mouseMoved() {
      if (currentState === "hub") {
        let hovering = false;
        for (let portal of portals) if (portal.hovered) { hovering = true; break; }
        cursor(hovering ? "pointer" : "default");
      } else if (currentState === "autumn") {
        let hoveringApple = false;
        for (let apple of roomState.autumn.apples) {
          if (!apple.picked && !apple.falling) {
            const d = dist(mouseX, mouseY, apple.x, apple.y);
            if (d < apple.size / 2) { hoveringApple = true; break; }
          }
        }
        cursor(hoveringApple ? "pointer" : "default");
      } else {
        cursor("default");
      }
    }
  </script>
