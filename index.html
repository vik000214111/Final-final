<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Cloud Hub - Multi-Screen Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(100, 200, 255, 0.6);
      font-size: 12px;
      pointer-events: none;
      z-index: 1001;
    }
    #backButton {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(100, 200, 255, 0.2);
      border: 2px solid rgba(100, 200, 255, 0.6);
      color: rgba(100, 200, 255, 0.9);
      font-family: 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
      z-index: 1001;
      display: none;
      transition: all 0.3s;
    }
    #backButton:hover {
      background: rgba(100, 200, 255, 0.4);
      border-color: rgba(100, 200, 255, 1);
    }
    #gestureInstructions { display:none; }
  </style>
</head>

<body>
  <div id="info">Hover over portals to interact • Click to enter season realms</div>
  <button id="backButton">← BACK TO HUB</button>
  <div id="gestureInstructions"></div>
  <video id="webcam" style="display: none;" playsinline></video>

  <script>
    // ===========================================
    // CONFIG
    // ===========================================
    const CONFIG = {
      TREE_PARTICLE_COUNT: 2500,
      PARTICLE_SIZE_MIN: 1.5,
      PARTICLE_SIZE_MAX: 3.5,

      PULSE_SPEED: 0.015,
      PULSE_AMOUNT: 0.4,

      CONNECTION_COUNT: 150,
      CONNECTION_DISTANCE: 45,
      CONNECTION_ALPHA: 0.3,

      DUST_COUNT: 200,
      DUST_SPEED: 0.3,

      MOUSE_FIELD_RADIUS: 180,
      MOUSE_FIELD_STRENGTH: 15,

      PARTICLE_COLOR: [100, 200, 255],
      DUST_COLOR: [150, 180, 200],
      CONNECTION_COLOR: [80, 160, 220],
    };

    // ===========================================
    // STATE
    // ===========================================
    let currentState = "hub"; // hub | spring | summer | autumn | winter

    function setState(newState) {
      console.log(`Switching state: ${currentState} → ${newState}`);
      currentState = newState;

      const infoDiv = document.getElementById("info");
      const backButton = document.getElementById("backButton");

      if (currentState === "hub") {
        infoDiv.style.display = "block";
        backButton.style.display = "none";
      } else {
        infoDiv.style.display = "none";
        backButton.style.display = "block";
        initializeRoom(currentState);
      }
    }

    let treeParticles = [];
    let dustParticles = [];
    let connections = [];
    let portals = [];
    let timeOffset = 0;
    let mouseFieldActive = false;

    // MediaPipe Hands
    let handLandmarks = null;
    let lastLogTime = 0;

    // ===========================================
    // MEDIAPIPE HANDS INITIALIZATION
    // ===========================================
    function onHandResults(results) {
      handLandmarks = results.multiHandLandmarks && results.multiHandLandmarks.length > 0
        ? results.multiHandLandmarks
        : null;

      // Console log every second
      const now = Date.now();
      if (now - lastLogTime >= 1000) {
        lastLogTime = now;
        if (handLandmarks) {
          const simplified = handLandmarks.map((hand, idx) => ({
            hand: idx,
            landmarks: hand.length,
            wrist: hand[0],
            indexTip: hand[8],
            thumbTip: hand[4]
          }));
          console.log("Hand Data:", JSON.stringify(simplified, null, 2));
        } else {
          console.log("Hand Data: No hands detected");
        }
      }
    }

    async function initMediaPipeHands() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onHandResults);

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const videoElement = document.getElementById('webcam');
        videoElement.srcObject = stream;
        await videoElement.play();

        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await hands.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        camera.start();

        console.log("MediaPipe Hands initialized successfully!");
      } catch (err) {
        console.error("Failed to initialize MediaPipe Hands:", err);
      }
    }

    // Initialize MediaPipe after page loads
    window.addEventListener('load', () => {
      setTimeout(initMediaPipeHands, 1000);
    });

    // ===========================================
    // CLASSES
    // ===========================================
    class TreeBranch {
      constructor(x1, y1, x2, y2, depth) {
        this.x1 = x1; this.y1 = y1;
        this.x2 = x2; this.y2 = y2;
        this.depth = depth;
        this.length = dist(x1, y1, x2, y2);
      }
    }

    class Particle {
      constructor(x, y, size, isTree = true) {
        this.homeX = x; this.homeY = y;
        this.x = x; this.y = y;
        this.size = size;
        this.isTree = isTree;
        this.phase = random(TWO_PI);
        this.alpha = 1.0;

        if (!isTree) {
          this.vx = random(-CONFIG.DUST_SPEED, CONFIG.DUST_SPEED);
          this.vy = random(-CONFIG.DUST_SPEED, CONFIG.DUST_SPEED);
          this.alpha = random(0.2, 0.6);
        }
      }

      update() {
        if (this.isTree) {
          const breathe = sin(timeOffset * CONFIG.PULSE_SPEED + this.phase);
          this.alpha = map(breathe, -1, 1, 1 - CONFIG.PULSE_AMOUNT, 1);

          if (mouseFieldActive) {
            const dx = mouseX - this.homeX;
            const dy = mouseY - this.homeY;
            const distance = sqrt(dx * dx + dy * dy);

            if (distance < CONFIG.MOUSE_FIELD_RADIUS && distance > 0) {
              const force = (1 - distance / CONFIG.MOUSE_FIELD_RADIUS);
              const angle = atan2(dy, dx);
              const displacement = force * CONFIG.MOUSE_FIELD_STRENGTH;

              this.x = lerp(this.x, this.homeX - cos(angle) * displacement, 0.1);
              this.y = lerp(this.y, this.homeY - sin(angle) * displacement, 0.1);
            } else {
              this.x = lerp(this.x, this.homeX, 0.05);
              this.y = lerp(this.y, this.homeY, 0.05);
            }
          } else {
            this.x = lerp(this.x, this.homeX, 0.05);
            this.y = lerp(this.y, this.homeY, 0.05);
          }
        } else {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0) this.x = width;
          if (this.x > width) this.x = 0;
          if (this.y < 0) this.y = height;
          if (this.y > height) this.y = 0;
        }
      }

      draw() {
        if (this.isTree) {
          fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], this.alpha * 255);
        } else {
          fill(CONFIG.DUST_COLOR[0], CONFIG.DUST_COLOR[1], CONFIG.DUST_COLOR[2], this.alpha * 255);
        }
        noStroke();
        circle(this.x, this.y, this.size);
      }
    }

    class Portal {
      constructor(x, y, label, season) {
        this.x = x; this.y = y;
        this.label = label;
        this.season = season;
        this.radius = 50;
        this.hovered = false;
        this.glowParticles = [];
        this.pulse = 0;
      }

      update() {
        const d = dist(mouseX, mouseY, this.x, this.y);
        this.hovered = d < this.radius;
        this.pulse += 0.05;

        if (this.hovered && frameCount % 3 === 0) {
          const angle = random(TWO_PI);
          const r = random(this.radius * 0.8, this.radius * 1.2);
          this.glowParticles.push({
            x: this.x + cos(angle) * r,
            y: this.y + sin(angle) * r,
            vx: cos(angle) * 0.5,
            vy: sin(angle) * 0.5,
            life: 1.0,
            size: random(2, 4)
          });
        }

        for (let i = this.glowParticles.length - 1; i >= 0; i--) {
          const gp = this.glowParticles[i];
          gp.x += gp.vx;
          gp.y += gp.vy;
          gp.life -= 0.02;
          if (gp.life <= 0) this.glowParticles.splice(i, 1);
        }
      }

      draw() {
        push();

        for (let gp of this.glowParticles) {
          fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], gp.life * 200);
          noStroke();
          circle(gp.x, gp.y, gp.size);
        }

        noFill();
        const brightness = this.hovered ? 255 : 150;
        const pulseOffset = sin(this.pulse) * 3;

        stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], brightness);
        strokeWeight(2);
        circle(this.x, this.y, this.radius * 2 + pulseOffset);

        if (this.hovered) {
          stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 100);
          strokeWeight(1);
          circle(this.x, this.y, this.radius * 2.2);
        }

        fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], brightness);
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(14);
        text(this.label, this.x, this.y);

        pop();
      }

      click() {
        if (this.hovered) setState(this.season);
      }
    }

    // ===========================================
    // HUB GENERATION
    // ===========================================
    function generateTreePoints() {
      const branches = [];
      const particles = [];

      const trunkBase = { x: width / 2, y: height * 0.85 };
      const trunkTop  = { x: width / 2, y: height * 0.45 };

      function createBranch(x1, y1, angle, length, depth) {
        if (depth > 7 || length < 8) return;

        const x2 = x1 + cos(angle) * length;
        const y2 = y1 + sin(angle) * length;

        branches.push(new TreeBranch(x1, y1, x2, y2, depth));

        const angleVar = random(0.3, 0.5);
        const lengthReduce = random(0.65, 0.75);

        createBranch(x2, y2, angle - angleVar, length * lengthReduce, depth + 1);
        createBranch(x2, y2, angle + angleVar, length * lengthReduce, depth + 1);

        if (random() > 0.7 && depth < 5) {
          createBranch(x2, y2, angle + random(-0.2, 0.2), length * lengthReduce * 0.8, depth + 1);
        }
      }

      branches.push(new TreeBranch(trunkBase.x, trunkBase.y, trunkTop.x, trunkTop.y, 0));
      createBranch(trunkTop.x, trunkTop.y, -PI / 2, 80, 1);

      const pointsPerBranch = Math.floor(CONFIG.TREE_PARTICLE_COUNT / branches.length);

      for (let b of branches) {
        const density = map(b.depth, 0, 7, 0.5, 1.5);
        const numPoints = Math.floor(pointsPerBranch * density);

        for (let i = 0; i < numPoints; i++) {
          const t = i / numPoints;
          const x = lerp(b.x1, b.x2, t) + random(-3, 3);
          const y = lerp(b.y1, b.y2, t) + random(-3, 3);

          const size = map(b.depth, 0, 7, CONFIG.PARTICLE_SIZE_MAX, CONFIG.PARTICLE_SIZE_MIN);
          particles.push(new Particle(x, y, size + random(-0.5, 0.5), true));
        }
      }

      return particles;
    }

    function generateDustParticles() {
      const dust = [];
      for (let i = 0; i < CONFIG.DUST_COUNT; i++) {
        dust.push(new Particle(random(width), random(height), random(1, 2.5), false));
      }
      return dust;
    }

    function generateConnections() {
      const cons = [];
      const gridSize = CONFIG.CONNECTION_DISTANCE;
      const grid = {};

      for (let p of treeParticles) {
        const gx = Math.floor(p.homeX / gridSize);
        const gy = Math.floor(p.homeY / gridSize);
        const key = `${gx},${gy}`;
        if (!grid[key]) grid[key] = [];
        grid[key].push(p);
      }

      for (let p1 of treeParticles) {
        if (cons.length >= CONFIG.CONNECTION_COUNT) break;

        const gx = Math.floor(p1.homeX / gridSize);
        const gy = Math.floor(p1.homeY / gridSize);

        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const key = `${gx + dx},${gy + dy}`;
            const neighbors = grid[key] || [];

            for (let p2 of neighbors) {
              if (p1 === p2) continue;
              const d = dist(p1.homeX, p1.homeY, p2.homeX, p2.homeY);
              if (d < CONFIG.CONNECTION_DISTANCE) {
                cons.push({ p1, p2, dist: d });
                if (cons.length >= CONFIG.CONNECTION_COUNT) return cons;
              }
            }
          }
        }
      }
      return cons;
    }

    function setupPortals() {
      const centerX = width / 2;
      const centerY = height * 0.6;
      const r = Math.min(width, height) * 0.4;

      return [
        new Portal(centerX - r, centerY - r * 0.3, "SPRING", "spring"),
        new Portal(centerX + r, centerY - r * 0.3, "SUMMER", "summer"),
        new Portal(centerX - r, centerY + r * 0.5, "AUTUMN", "autumn"),
        new Portal(centerX + r, centerY + r * 0.5, "WINTER", "winter"),
      ];
    }

    function updateHubParticles() {
      for (let p of treeParticles) p.update();
      for (let p of dustParticles) p.update();
      for (let portal of portals) portal.update();
      timeOffset++;
    }

    function drawHubTree() {
      stroke(CONFIG.CONNECTION_COLOR[0], CONFIG.CONNECTION_COLOR[1], CONFIG.CONNECTION_COLOR[2], CONFIG.CONNECTION_ALPHA * 255);
      strokeWeight(0.5);
      for (let c of connections) {
        const a = map(c.dist, 0, CONFIG.CONNECTION_DISTANCE, CONFIG.CONNECTION_ALPHA, 0);
        stroke(CONFIG.CONNECTION_COLOR[0], CONFIG.CONNECTION_COLOR[1], CONFIG.CONNECTION_COLOR[2], a * 255);
        line(c.p1.x, c.p1.y, c.p2.x, c.p2.y);
      }
      for (let p of treeParticles) p.draw();
    }

    function handleHubMouseField() {
      mouseFieldActive = (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height);
    }

    // ===========================================
    // ROOM STATE
    // ===========================================
    let roomState = {
      spring: {
        airPetals: [],
        groundPetals: [],
        wind: { x: 0, y: 0, strength: 0 },
        ambientParticles: [],
        prevMouseX: 0,
        prevMouseY: 0
      },
      summer: { wavePoints: [], ambientParticles: [] },
      autumn: { apples: [], basket: null, ambientParticles: [] },
      winter: { snowParticles: [], traces: [], ambientParticles: [] }
    };

    function initializeRoom(room) {
      if (room === "spring") initializeSpring();
      if (room === "summer") initializeSummer();
      if (room === "autumn") initializeAutumn();
      if (room === "winter") initializeWinter();
    }

    // ===========================================
    // UI HELPERS
    // ===========================================
    function generateAmbientParticles(count = 30) {
      const ps = [];
      for (let i = 0; i < count; i++) {
        ps.push({
          x: random(width),
          y: random(height),
          vx: random(-0.2, 0.2),
          vy: random(-0.2, 0.2),
          size: random(1, 2),
          alpha: random(0.1, 0.3),
          phase: random(TWO_PI)
        });
      }
      return ps;
    }

    function updateAmbientParticles(ps) {
      for (let p of ps) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;
        p.alpha = 0.2 + sin(frameCount * 0.02 + p.phase) * 0.1;
      }
    }

    function drawAmbientParticles(ps) {
      noStroke();
      for (let p of ps) {
        fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], p.alpha * 255);
        circle(p.x, p.y, p.size);
      }
    }

    function drawTechGrid(spacing = 50, opacity = 15) {
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], opacity);
      strokeWeight(0.5);
      for (let x = 0; x <= width; x += spacing) line(x, 0, x, height);
      for (let y = 0; y <= height; y += spacing) line(0, y, width, y);
    }

    // Radial vignette using Canvas 2D API gradient (no grey boxes!)
    function drawVignetteRadial(strength = 0.55) {
      const ctx = drawingContext;
      const r0 = Math.min(width, height) * 0.25;
      const r1 = Math.min(width, height) * 0.75;
      const g = ctx.createRadialGradient(width/2, height/2, r0, width/2, height/2, r1);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, `rgba(0,0,0,${strength})`);
      ctx.save();
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    function drawStageBoundary() {
      const stageWidth = width * 0.7;
      const stageHeight = height * 0.6;
      const stageX = (width - stageWidth) / 2;
      const stageY = (height - stageHeight) / 2 + 40;

      push();
      noFill();
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 80);
      strokeWeight(1);
      rect(stageX, stageY, stageWidth, stageHeight);

      const cornerSize = 15;
      strokeWeight(2);
      line(stageX, stageY, stageX + cornerSize, stageY);
      line(stageX, stageY, stageX, stageY + cornerSize);

      line(stageX + stageWidth, stageY, stageX + stageWidth - cornerSize, stageY);
      line(stageX + stageWidth, stageY, stageX + stageWidth, stageY + cornerSize);

      line(stageX, stageY + stageHeight, stageX + cornerSize, stageY + stageHeight);
      line(stageX, stageY + stageHeight, stageX, stageY + stageHeight - cornerSize);

      line(stageX + stageWidth, stageY + stageHeight, stageX + stageWidth - cornerSize, stageY + stageHeight);
      line(stageX + stageWidth, stageY + stageHeight, stageX + stageWidth, stageY + stageHeight - cornerSize);
      pop();
    }

    function drawTopBar(roomTitle, statusText) {
      push();
      fill(0, 0, 0, 150);
      noStroke();
      rect(0, 0, width, 60);

      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 100);
      strokeWeight(1);
      line(0, 60, width, 60);

      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 220);
      noStroke();
      textAlign(LEFT, CENTER);
      textSize(20);
      text(roomTitle, 80, 30);

      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 150);
      strokeWeight(2);
      line(70, 20, 70, 40);

      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 150);
      noStroke();
      textAlign(RIGHT, CENTER);
      textSize(11);
      text(statusText, width - 20, 30);

      pop();
    }

    function drawInstructionPanel(title, instruction) {
      push();

      const panelWidth = 280;
      const panelHeight = 80;
      const panelX = width - panelWidth - 20;
      const panelY = height - panelHeight - 20;

      fill(0, 0, 0, 180);
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 120);
      strokeWeight(1);
      rect(panelX, panelY, panelWidth, panelHeight, 5);

      noFill();
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 40);
      strokeWeight(2);
      rect(panelX - 2, panelY - 2, panelWidth + 4, panelHeight + 4, 5);

      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 30);
      noStroke();
      rect(panelX, panelY, panelWidth, 25, 5, 5, 0, 0);

      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 220);
      textAlign(LEFT, CENTER);
      textSize(12);
      text(title, panelX + 10, panelY + 12);

      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 180);
      textSize(10);
      textAlign(LEFT, TOP);
      text(instruction, panelX + 10, panelY + 32, panelWidth - 20);

      pop();
    }

    // ===========================================
    // MEDIAPIPE DEBUG OVERLAY & DATA PANEL
    // ===========================================
    // MediaPipe hand landmark connections (21 points skeleton)
    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],           // Thumb
      [0, 5], [5, 6], [6, 7], [7, 8],           // Index
      [0, 9], [9, 10], [10, 11], [11, 12],      // Middle
      [0, 13], [13, 14], [14, 15], [15, 16],    // Ring
      [0, 17], [17, 18], [18, 19], [19, 20],    // Pinky
      [5, 9], [9, 13], [13, 17]                 // Palm
    ];

    function drawHandDebugOverlay() {
      if (!handLandmarks) return;

      push();
      for (let hand of handLandmarks) {
        // Draw skeleton connections
        stroke(100, 200, 255, 180);
        strokeWeight(2);
        for (let [i, j] of HAND_CONNECTIONS) {
          const p1 = hand[i];
          const p2 = hand[j];
          line(p1.x * width, p1.y * height, p2.x * width, p2.y * height);
        }

        // Draw 21 landmark points
        noStroke();
        for (let i = 0; i < hand.length; i++) {
          const lm = hand[i];
          const px = lm.x * width;
          const py = lm.y * height;

          // Color code: wrist=red, fingertips=green, others=cyan
          if (i === 0) {
            fill(255, 100, 100, 220);  // Wrist
          } else if ([4, 8, 12, 16, 20].includes(i)) {
            fill(100, 255, 100, 220);  // Fingertips
          } else {
            fill(100, 200, 255, 220);  // Other joints
          }
          circle(px, py, 8);

          // Label key points
          if (i === 0 || [4, 8, 12, 16, 20].includes(i)) {
            fill(255, 255, 255, 200);
            textSize(9);
            textAlign(CENTER, CENTER);
            text(i, px, py - 12);
          }
        }
      }
      pop();
    }

    function calculatePalmCenter(hand) {
      // Palm center = average of wrist + 4 palm base points
      const palmIndices = [0, 1, 5, 9, 13, 17];
      let sumX = 0, sumY = 0;
      for (let i of palmIndices) {
        sumX += hand[i].x;
        sumY += hand[i].y;
      }
      return { x: sumX / palmIndices.length, y: sumY / palmIndices.length };
    }

    function calculatePinchStrength(hand) {
      // Distance between thumb tip (4) and index tip (8)
      const thumb = hand[4];
      const index = hand[8];
      const dx = thumb.x - index.x;
      const dy = thumb.y - index.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      // Normalize: closer = stronger pinch (invert and clamp)
      return Math.max(0, Math.min(1, 1 - dist * 15));
    }

    function calculateHandDistance(hand1, hand2) {
      const c1 = calculatePalmCenter(hand1);
      const c2 = calculatePalmCenter(hand2);
      const dx = c1.x - c2.x;
      const dy = c1.y - c2.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function drawGestureDataPanel() {
      push();

      const panelWidth = 280;
      const panelHeight = 140;
      const panelX = 20;
      const panelY = height - panelHeight - 20;

      // Panel background
      fill(0, 0, 0, 180);
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 120);
      strokeWeight(1);
      rect(panelX, panelY, panelWidth, panelHeight, 5);

      // Outer glow
      noFill();
      stroke(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 40);
      strokeWeight(2);
      rect(panelX - 2, panelY - 2, panelWidth + 4, panelHeight + 4, 5);

      // Header
      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 30);
      noStroke();
      rect(panelX, panelY, panelWidth, 25, 5, 5, 0, 0);

      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 220);
      textAlign(LEFT, CENTER);
      textSize(12);
      text("GESTURE DATA", panelX + 10, panelY + 12);

      // Data content
      fill(CONFIG.PARTICLE_COLOR[0], CONFIG.PARTICLE_COLOR[1], CONFIG.PARTICLE_COLOR[2], 180);
      textSize(10);
      textAlign(LEFT, TOP);

      let yOffset = panelY + 35;
      const lineHeight = 18;

      if (handLandmarks && handLandmarks.length > 0) {
        text(`Hands Count: ${handLandmarks.length}`, panelX + 10, yOffset);
        yOffset += lineHeight;

        for (let i = 0; i < handLandmarks.length; i++) {
          const hand = handLandmarks[i];
          const palmCenter = calculatePalmCenter(hand);
          const pinchStrength = calculatePinchStrength(hand);

          text(`Hand ${i} Palm: (${(palmCenter.x * width).toFixed(0)}, ${(palmCenter.y * height).toFixed(0)})`, panelX + 10, yOffset);
          yOffset += lineHeight;

          const pinchBar = Math.floor(pinchStrength * 10);
          const pinchVis = "█".repeat(pinchBar) + "░".repeat(10 - pinchBar);
          text(`Hand ${i} Pinch: ${pinchVis} ${(pinchStrength * 100).toFixed(0)}%`, panelX + 10, yOffset);
          yOffset += lineHeight;
        }

        if (handLandmarks.length === 2) {
          const dist = calculateHandDistance(handLandmarks[0], handLandmarks[1]);
          text(`Hand Distance: ${(dist * 100).toFixed(1)}%`, panelX + 10, yOffset);
        }
      } else {
        text("No hands detected", panelX + 10, yOffset);
      }

      pop();
    }

    // ===========================================
    // SPRING
    // ===========================================
    function initializeSpring() {
      roomState.spring.airPetals = [];
      roomState.spring.groundPetals = [];
      roomState.spring.wind = { x: 0, y: 0, strength: 0 };
      roomState.spring.prevMouseX = mouseX;
      roomState.spring.prevMouseY = mouseY;

      for (let i = 0; i < 60; i++) spawnSpringPetal();
      roomState.spring.ambientParticles = generateAmbientParticles(30);
    }

    function spawnSpringPetal() {
      const treeX = width / 2;
      const treeCanopyY = height * 0.4;
      roomState.spring.airPetals.push({
        x: treeX + random(-120, 120),
        y: treeCanopyY + random(-60, 20),
        vx: random(-0.3, 0.3),
        vy: random(0.2, 0.8),
        rot: random(TWO_PI),
        rotSpeed: random(-0.08, 0.08),
        size: random(5, 9),
        drift: random(-0.1, 0.1),
        color: [255, random(200, 230), random(220, 240)]
      });
    }

    function updateSpring() {
      const mouseVx = mouseX - roomState.spring.prevMouseX;
      const mouseVy = mouseY - roomState.spring.prevMouseY;
      roomState.spring.prevMouseX = mouseX;
      roomState.spring.prevMouseY = mouseY;

      const raw = constrain(sqrt(mouseVx * mouseVx + mouseVy * mouseVy), 0, 20);
      const targetX = mouseVx * 0.5;
      const targetY = mouseVy * 0.5;
      const targetS = raw / 20;

      roomState.spring.wind.x = lerp(roomState.spring.wind.x, targetX, 0.15);
      roomState.spring.wind.y = lerp(roomState.spring.wind.y, targetY, 0.15);
      roomState.spring.wind.strength = lerp(roomState.spring.wind.strength, targetS, 0.1);

      if (raw < 0.5) {
        roomState.spring.wind.x *= 0.95;
        roomState.spring.wind.y *= 0.95;
        roomState.spring.wind.strength *= 0.95;
      }

      const groundY = height * 0.72;

      for (let i = roomState.spring.airPetals.length - 1; i >= 0; i--) {
        const p = roomState.spring.airPetals[i];

        p.vy += 0.08;

        const dx = mouseX - p.x;
        const dy = mouseY - p.y;
        const d = sqrt(dx * dx + dy * dy);
        const radius = 160;

        if (d < radius && roomState.spring.wind.strength > 0.05) {
          const infl = (1 - d / radius) * roomState.spring.wind.strength;
          p.vx += roomState.spring.wind.x * infl * 0.3;
          p.vy += roomState.spring.wind.y * infl * 0.3;
        }

        p.vx += random(-0.05, 0.05);
        p.vx += p.drift;
        p.vx *= 0.99;

        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotSpeed;

        if (p.y >= groundY) {
          roomState.spring.groundPetals.push({
            x: p.x,
            y: groundY + random(-2, 5),
            rot: p.rot,
            size: p.size,
            alpha: 0.9,
            color: p.color
          });
          roomState.spring.airPetals.splice(i, 1);

          if (roomState.spring.groundPetals.length > 2000) {
            const removeCount = Math.floor(roomState.spring.groundPetals.length * 0.1);
            roomState.spring.groundPetals.splice(0, removeCount);
          }
        } else {
          if (p.x < -20) p.x = width + 20;
          if (p.x > width + 20) p.x = -20;
          if (p.y < -50 || p.y > height + 50) roomState.spring.airPetals.splice(i, 1);
        }
      }

      const maxAir = 180;
      if (frameCount % 3 === 0) {
        while (roomState.spring.airPetals.length < maxAir) spawnSpringPetal();
      }

      updateAmbientParticles(roomState.spring.ambientParticles);
    }

    function drawSpring() {
      for (let i = 0; i < height; i++) {
        const inter = map(i, 0, height, 0, 1);
        const c = lerpColor(color(180, 220, 255), color(255, 240, 220), inter);
        stroke(c);
        line(0, i, width, i);
      }

      drawTechGrid(60, 10);
      drawAmbientParticles(roomState.spring.ambientParticles);
      drawStageBoundary();

      fill(100, 180, 100, 120);
      noStroke();
      rect(0, height * 0.72, width, height * 0.28);

      for (let gp of roomState.spring.groundPetals) {
        push();
        translate(gp.x, gp.y);
        rotate(gp.rot);
        fill(gp.color[0], gp.color[1], gp.color[2], gp.alpha * 200);
        noStroke();
        ellipse(0, 0, gp.size * 0.8, gp.size * 1.2);
        pop();
      }

      const treeX = width / 2;
      const trunkBase = height * 0.72;
      const trunkTop = height * 0.45;
      const sway = sin(frameCount * 0.02) * 3;

      push();
      fill(80, 60, 50, 200);
      noStroke();
      rect(treeX - 15, trunkTop, 30, trunkBase - trunkTop);

      stroke(90, 70, 60, 200);
      strokeWeight(8);
      noFill();

      beginShape();
      vertex(treeX, trunkTop + 20);
      bezierVertex(treeX - 40 + sway, trunkTop + 40, treeX - 80 + sway, trunkTop + 60, treeX - 110 + sway, trunkTop + 100);
      endShape();

      beginShape();
      vertex(treeX, trunkTop + 20);
      bezierVertex(treeX + 40 - sway, trunkTop + 40, treeX + 80 - sway, trunkTop + 60, treeX + 110 - sway, trunkTop + 100);
      endShape();

      pop();

      noStroke();
      for (let i = 0; i < 200; i++) {
        const cx = treeX + random(-130, 130) + sway * random(-0.5, 0.5);
        const cy = trunkTop + random(-70, 120);
        const dd = dist(cx, cy, treeX, trunkTop + 25);
        if (dd < 140) {
          fill(255, random(210, 230), random(220, 240), random(150, 220));
          circle(cx, cy, random(3, 7));
        }
      }

      for (let p of roomState.spring.airPetals) {
        push();
        translate(p.x, p.y);
        rotate(p.rot);
        fill(p.color[0], p.color[1], p.color[2], 220);
        noStroke();
        ellipse(0, 0, p.size, p.size * 1.4);
        pop();
      }

      drawVignetteRadial(0.5);

      const windBar = Math.floor(roomState.spring.wind.strength * 20);
      const windStr = "█".repeat(windBar) + "░".repeat(20 - windBar);
      drawTopBar("SPRING ENVIRONMENT", `WIND:${windStr} | AIR:${roomState.spring.airPetals.length} | GROUND:${roomState.spring.groundPetals.length}`);

      drawInstructionPanel("INTERACTION PROTOCOL", "Wave one hand to create wind. Petals fall and accumulate on the ground.");
    }

    // ===========================================
    // SUMMER
    // ===========================================
    function initializeSummer() {
      roomState.summer.wavePoints = [];
      const spacing = 20;
      for (let x = 0; x <= width; x += spacing) {
        for (let y = 0; y <= height; y += spacing) {
          roomState.summer.wavePoints.push({ x, y, baseY: y, offset: random(TWO_PI) });
        }
      }
      roomState.summer.ambientParticles = generateAmbientParticles(30);
    }

    function updateSummer() {
      for (let wp of roomState.summer.wavePoints) {
        const w = sin(frameCount * 0.02 + wp.offset + wp.x * 0.01) * 15;
        wp.y = wp.baseY + w;
      }
      updateAmbientParticles(roomState.summer.ambientParticles);
    }

    function drawSummer() {
      for (let i = 0; i < height; i++) {
        const inter = map(i, 0, height, 0, 1);
        const c = lerpColor(color(100, 180, 255), color(20, 60, 120), inter);
        stroke(c);
        line(0, i, width, i);
      }

      drawTechGrid(70, 12);
      drawAmbientParticles(roomState.summer.ambientParticles);
      drawStageBoundary();

      stroke(150, 220, 255, 80);
      strokeWeight(2);
      for (let wp of roomState.summer.wavePoints) {
        point(wp.x, wp.y);
      }

      noFill();
      stroke(200, 240, 255, 120);
      strokeWeight(1);
      for (let y = height * 0.35; y < height * 0.7; y += 40) {
        beginShape();
        for (let x = 0; x <= width; x += 20) {
          const w = sin(frameCount * 0.02 + x * 0.01 + y * 0.005) * 20;
          vertex(x, y + w);
        }
        endShape();
      }

      drawVignetteRadial(0.5);
      drawTopBar("SUMMER ENVIRONMENT", "GESTURE MODE: INACTIVE");
      drawInstructionPanel("INTERACTION PROTOCOL", "Two hands detected will enable wave surface deformation. Hand positions control amplitude and frequency.");
    }

    // ===========================================
    // AUTUMN
    // ===========================================
    function initializeAutumn() {
      roomState.autumn.apples = [];
      roomState.autumn.basket = { x: width / 2, y: height * 0.8, width: 100, height: 40 };

      for (let i = 0; i < 15; i++) {
        roomState.autumn.apples.push({
          x: width / 2 + random(-150, 150),
          y: height * 0.35 + random(0, 150),
          size: random(20, 30),
          picked: false,
          falling: false,
          vy: 0
        });
      }
      roomState.autumn.ambientParticles = generateAmbientParticles(30);
    }

    function updateAutumn() {
      for (let a of roomState.autumn.apples) {
        if (a.falling) {
          a.vy += 0.5;
          a.y += a.vy;

          const b = roomState.autumn.basket;
          if (a.y >= b.y && a.x >= b.x - b.width / 2 && a.x <= b.x + b.width / 2) {
            a.picked = true;
            a.falling = false;
          }
          if (a.y > height + 50) {
            a.falling = false;
            a.y = -1000;
          }
        }
      }
      updateAmbientParticles(roomState.autumn.ambientParticles);
    }

    function drawAutumn() {
      for (let i = 0; i < height; i++) {
        const inter = map(i, 0, height, 0, 1);
        const c = lerpColor(color(255, 200, 150), color(200, 120, 80), inter);
        stroke(c);
        line(0, i, width, i);
      }

      drawTechGrid(65, 8);
      drawAmbientParticles(roomState.autumn.ambientParticles);
      drawStageBoundary();

      fill(160, 100, 60, 120);
      noStroke();
      rect(0, height * 0.7, width, height * 0.3);

      fill(100, 60, 40, 150);
      rect(width / 2 - 20, height * 0.35, 40, height * 0.35);
      ellipse(width / 2, height * 0.4, 280, 180);

      const b = roomState.autumn.basket;
      fill(160, 120, 80);
      stroke(100, 70, 50);
      strokeWeight(2);
      rect(b.x - b.width / 2, b.y, b.width, b.height, 5);

      noStroke();
      for (let a of roomState.autumn.apples) {
        if (!a.picked && a.y > -100) {
          fill(220, 50, 50);
          circle(a.x, a.y, a.size);
          stroke(100, 60, 40);
          strokeWeight(2);
          line(a.x, a.y - a.size / 2, a.x, a.y - a.size / 2 - 5);
        }
      }

      drawVignetteRadial(0.5);
      drawTopBar("AUTUMN ENVIRONMENT", "GESTURE MODE: INACTIVE");
      drawInstructionPanel("INTERACTION PROTOCOL", "Single hand picking gesture will trigger apple harvest. Target apples and bring hand down to collect.");
    }

    // ===========================================
    // WINTER
    // ===========================================
    function initializeWinter() {
      roomState.winter.snowParticles = [];
      roomState.winter.traces = [];
      for (let i = 0; i < 150; i++) {
        roomState.winter.snowParticles.push({
          x: random(width),
          y: random(height),
          vx: random(-0.3, 0.3),
          vy: random(0.5, 1.5),
          size: random(2, 6)
        });
      }
      roomState.winter.ambientParticles = generateAmbientParticles(30);
    }

    function updateWinter() {
      for (let s of roomState.winter.snowParticles) {
        s.x += s.vx; s.y += s.vy;
        if (s.y > height) { s.y = -10; s.x = random(width); }
        if (s.x < 0) s.x = width;
        if (s.x > width) s.x = 0;
      }

      if (mouseIsPressed) {
        roomState.winter.traces.push({ x: mouseX, y: mouseY, life: 1.0 });
      }
      for (let i = roomState.winter.traces.length - 1; i >= 0; i--) {
        roomState.winter.traces[i].life -= 0.01;
        if (roomState.winter.traces[i].life <= 0) roomState.winter.traces.splice(i, 1);
      }

      updateAmbientParticles(roomState.winter.ambientParticles);
    }

    function drawWinter() {
      for (let i = 0; i < height; i++) {
        const inter = map(i, 0, height, 0, 1);
        const c = lerpColor(color(200, 220, 240), color(240, 250, 255), inter);
        stroke(c);
        line(0, i, width, i);
      }

      drawTechGrid(55, 8);
      drawAmbientParticles(roomState.winter.ambientParticles);
      drawStageBoundary();

      fill(240, 245, 255, 150);
      noStroke();
      rect(0, height * 0.7, width, height * 0.3);

      for (let t of roomState.winter.traces) {
        fill(150, 200, 255, t.life * 150);
        noStroke();
        circle(t.x, t.y, 15);
      }

      fill(255, 255, 255, 180);
      noStroke();
      for (let s of roomState.winter.snowParticles) circle(s.x, s.y, s.size);

      fill(255, 255, 255, 200);
      stroke(200, 220, 240);
      strokeWeight(2);
      circle(width / 2, height * 0.5, 70);
      circle(width / 2, height * 0.6, 90);

      drawVignetteRadial(0.5);
      drawTopBar("WINTER ENVIRONMENT", "GESTURE MODE: INACTIVE");
      drawInstructionPanel("INTERACTION PROTOCOL", "Two hands sculpting motion will manipulate snow particles and create persistent trace patterns.");
    }

    // ===========================================
    // P5 MAIN
    // ===========================================
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.elt.style.position = "fixed";
      canvas.elt.style.left = "0";
      canvas.elt.style.top = "0";
      canvas.elt.style.zIndex = "0";

      treeParticles = generateTreePoints();
      dustParticles = generateDustParticles();
      connections = generateConnections();
      portals = setupPortals();

      document.getElementById("backButton").addEventListener("click", function (e) {
        e.stopPropagation();
        setState("hub");
      });

      window.setState = setState;

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && currentState !== "hub") setState("hub");
      });

      console.log("Hub initialized successfully!");
    }

    function draw() {
      if (currentState === "hub") {
        drawHub();
      } else if (currentState === "spring") {
        updateSpring(handLandmarks);
        drawSpring();
      } else if (currentState === "summer") {
        updateSummer(handLandmarks);
        drawSummer();
      } else if (currentState === "autumn") {
        updateAutumn(handLandmarks);
        drawAutumn();
      } else if (currentState === "winter") {
        updateWinter(handLandmarks);
        drawWinter();
      }

      // MediaPipe debug overlay and data panel (always show)
      drawHandDebugOverlay();
      drawGestureDataPanel();

      if (frameCount % 60 === 0) console.log(`FPS: ${Math.round(frameRate())}`);
    }

    function drawHub() {
      background(0, 0, 0, 25);

      for (let p of dustParticles) p.draw();

      updateHubParticles();
      handleHubMouseField();

      drawHubTree();
      for (let portal of portals) portal.draw();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      treeParticles = generateTreePoints();
      connections = generateConnections();
      portals = setupPortals();
    }

    function mouseClicked() {
      if (currentState === "hub") {
        for (let portal of portals) portal.click();
      } else if (currentState === "autumn") {
        for (let a of roomState.autumn.apples) {
          if (!a.picked && !a.falling) {
            const d = dist(mouseX, mouseY, a.x, a.y);
            if (d < a.size / 2) a.falling = true;
          }
        }
      }
    }

    function mouseMoved() {
      if (currentState === "hub") {
        let hovering = false;
        for (let portal of portals) if (portal.hovered) { hovering = true; break; }
        cursor(hovering ? "pointer" : "default");
      } else if (currentState === "autumn") {
        let hoveringApple = false;
        for (let a of roomState.autumn.apples) {
          if (!a.picked && !a.falling) {
            const d = dist(mouseX, mouseY, a.x, a.y);
            if (d < a.size / 2) { hoveringApple = true; break; }
          }
        }
        cursor(hoveringApple ? "pointer" : "default");
      } else {
        cursor("default");
      }
    }
  </script>
</body>
