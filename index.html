        Hover over portals to interact • Click to enter season realms
    </div>
    <button id="backButton" onclick="setState('hub')">← BACK TO HUB</button>
    <div id="gestureInstructions"></div>

    <script>
        // ===========================================
        // MYSTERY LEVEL CONFIGURATION
        // ===========================================
        const CONFIG = {
            // Tree particle settings
            TREE_PARTICLE_COUNT: 2500,        // Total points in tree (adjust for density)
            PARTICLE_SIZE_MIN: 1.5,           // Minimum particle size
            PARTICLE_SIZE_MAX: 3.5,           // Maximum particle size

            // Breathing/pulsing effect
            PULSE_SPEED: 0.015,               // Speed of brightness breathing (lower = slower)
            PULSE_AMOUNT: 0.4,                // Intensity of pulse (0-1)

            // Neural network connections
            CONNECTION_COUNT: 150,            // Max number of connecting lines
            CONNECTION_DISTANCE: 45,          // Max distance to connect particles
            CONNECTION_ALPHA: 0.3,            // Line opacity

            // Floating dust
            DUST_COUNT: 200,                  // Number of ambient dust particles
            DUST_SPEED: 0.3,                  // Dust movement speed

            // Mouse interaction field
            MOUSE_FIELD_RADIUS: 180,          // Radius of mouse influence
            MOUSE_FIELD_STRENGTH: 15,         // Displacement strength

            // Visual style
            PARTICLE_COLOR: [100, 200, 255],  // RGB for tree particles
            DUST_COLOR: [150, 180, 200],      // RGB for dust
            CONNECTION_COLOR: [80, 160, 220], // RGB for connecting lines
        };

        // ===========================================
        // STATE MANAGEMENT
        // ===========================================
        let currentState = "hub"; // "hub" | "spring" | "summer" | "autumn" | "winter"

        function setState(newState) {
            console.log(`Switching state: ${currentState} → ${newState}`);
            currentState = newState;

            // Update UI elements
            const infoDiv = document.getElementById('info');
            const backButton = document.getElementById('backButton');
            const gestureInstructions = document.getElementById('gestureInstructions');

            if (currentState === "hub") {
                infoDiv.style.display = 'block';
                backButton.style.display = 'none';
                gestureInstructions.style.display = 'none';
            } else {
                infoDiv.style.display = 'none';
                backButton.style.display = 'block';
                gestureInstructions.style.display = 'block';

                // Set room-specific instructions
                const instructions = {
                    spring: "Single hand wave → wind field → petals move",
                    summer: "Two hands → wave surface deforms",
                    autumn: "Single hand picking gesture → pick apple → drop into basket",
                    winter: "Two hands → sculpt snow / leave traces"
                };
                gestureInstructions.innerHTML = `<strong>${currentState.toUpperCase()} ROOM</strong><br>${instructions[currentState]}`;
            }

            // Initialize room-specific state if needed
            if (currentState !== "hub") {
                initializeRoom(currentState);
            }
        }

        // ===========================================
        // GLOBAL STATE
        // ===========================================
        let treeParticles = [];
        let dustParticles = [];
        let connections = [];
        let portals = [];
        let timeOffset = 0;
        let mouseFieldActive = false;

        // MEDIAPIPE HANDS INTEGRATION (PLACEHOLDER)
        // ===========================================
        // This section will be populated when webcam/gesture control is added
        let handDetector = null;
        let handLandmarks = null;

        // Tree structure
        class TreeBranch {
            constructor(x1, y1, x2, y2, depth) {
                this.x1 = x1;
                this.y1 = y1;
                this.x2 = x2;
                this.y2 = y2;
                this.depth = depth;
                this.length = dist(x1, y1, x2, y2);
            }
        }

        // Particle class
        class Particle {
            constructor(x, y, size, isTree = true) {
                this.homeX = x;
                this.homeY = y;
                this.x = x;
                this.y = y;
                this.size = size;
                this.isTree = isTree;
                this.phase = random(TWO_PI); // For breathing effect
                this.alpha = 1.0;

                // Dust-specific properties
                if (!isTree) {
                    this.vx = random(-CONFIG.DUST_SPEED, CONFIG.DUST_SPEED);
                    this.vy = random(-CONFIG.DUST_SPEED, CONFIG.DUST_SPEED);
                    this.alpha = random(0.2, 0.6);
                }
            }

            update() {
                if (this.isTree) {
                    // Apply breathing effect
                    const breathe = sin(timeOffset * CONFIG.PULSE_SPEED + this.phase);
                    this.alpha = map(breathe, -1, 1,
                        1 - CONFIG.PULSE_AMOUNT,
                        1);

                    // Apply mouse field influence
                    if (mouseFieldActive) {
                        const dx = mouseX - this.homeX;
                        const dy = mouseY - this.homeY;
                        const distance = sqrt(dx * dx + dy * dy);

                        if (distance < CONFIG.MOUSE_FIELD_RADIUS && distance > 0) {
                            const force = (1 - distance / CONFIG.MOUSE_FIELD_RADIUS);
                            const angle = atan2(dy, dx);
                            const displacement = force * CONFIG.MOUSE_FIELD_STRENGTH;

                            // Smoothly move away from mouse
                            this.x = lerp(this.x,
                                this.homeX - cos(angle) * displacement,
                                0.1);
                            this.y = lerp(this.y,
                                this.homeY - sin(angle) * displacement,
                                0.1);
                        } else {
                            // Return to home position
                            this.x = lerp(this.x, this.homeX, 0.05);
                            this.y = lerp(this.y, this.homeY, 0.05);
                        }
                    } else {
                        // Return to home position
                        this.x = lerp(this.x, this.homeX, 0.05);
                        this.y = lerp(this.y, this.homeY, 0.05);
                    }
                } else {
                    // Dust particle movement
                    this.x += this.vx;
                    this.y += this.vy;

                    // Wrap around screen
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
            }

            draw() {
                if (this.isTree) {
                    fill(CONFIG.PARTICLE_COLOR[0],
                         CONFIG.PARTICLE_COLOR[1],
                         CONFIG.PARTICLE_COLOR[2],
                         this.alpha * 255);
                } else {
                    fill(CONFIG.DUST_COLOR[0],
                         CONFIG.DUST_COLOR[1],
                         CONFIG.DUST_COLOR[2],
                         this.alpha * 255);
                }
                noStroke();
                circle(this.x, this.y, this.size);
            }
        }

        // Portal class
        class Portal {
            constructor(x, y, label, season) {
                this.x = x;
                this.y = y;
                this.label = label;
                this.season = season;
                this.radius = 50;
                this.hovered = false;
                this.glowParticles = [];
                this.pulse = 0;
            }

            update() {
                // Check hover
                const d = dist(mouseX, mouseY, this.x, this.y);
                this.hovered = d < this.radius;

                // Update pulse
                this.pulse += 0.05;

                // Emit particles on hover
                if (this.hovered && frameCount % 3 === 0) {
                    const angle = random(TWO_PI);
                    const r = random(this.radius * 0.8, this.radius * 1.2);
                    this.glowParticles.push({
                        x: this.x + cos(angle) * r,
                        y: this.y + sin(angle) * r,
                        vx: cos(angle) * 0.5,
                        vy: sin(angle) * 0.5,
                        life: 1.0,
                        size: random(2, 4)
                    });
                }

                // Update glow particles
                for (let i = this.glowParticles.length - 1; i >= 0; i--) {
                    let p = this.glowParticles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life <= 0) {
                        this.glowParticles.splice(i, 1);
                    }
                }
            }

            draw() {
                push();

                // Draw glow particles
                for (let p of this.glowParticles) {
                    fill(CONFIG.PARTICLE_COLOR[0],
                         CONFIG.PARTICLE_COLOR[1],
                         CONFIG.PARTICLE_COLOR[2],
                         p.life * 200);
                    noStroke();
                    circle(p.x, p.y, p.size);
                }

                // Portal ring
                noFill();
                const brightness = this.hovered ? 255 : 150;
                const pulseOffset = sin(this.pulse) * 3;

                stroke(CONFIG.PARTICLE_COLOR[0],
                       CONFIG.PARTICLE_COLOR[1],
                       CONFIG.PARTICLE_COLOR[2],
                       brightness);
                strokeWeight(2);
                circle(this.x, this.y, this.radius * 2 + pulseOffset);

                // Inner glow when hovered
                if (this.hovered) {
                    stroke(CONFIG.PARTICLE_COLOR[0],
                           CONFIG.PARTICLE_COLOR[1],
                           CONFIG.PARTICLE_COLOR[2],
                           100);
                    strokeWeight(1);
                    circle(this.x, this.y, this.radius * 2.2);
                }

                // Label
                fill(CONFIG.PARTICLE_COLOR[0],
                     CONFIG.PARTICLE_COLOR[1],
                     CONFIG.PARTICLE_COLOR[2],
                     brightness);
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(14);
                text(this.label, this.x, this.y);

                pop();
            }

            click() {
                if (this.hovered) {
                    setState(this.season);
                }
            }
        }

        // ===========================================
        // TREE GENERATION
        // ===========================================
        function generateTreePoints() {
            console.log("Generating tree structure...");
            const branches = [];
            const particles = [];

            // Start with trunk at bottom center
            const trunkBase = { x: width / 2, y: height * 0.85 };
            const trunkTop = { x: width / 2, y: height * 0.45 };

            // Recursively generate branches
            function createBranch(x1, y1, angle, length, depth) {
                if (depth > 7 || length < 8) return;

                const x2 = x1 + cos(angle) * length;
                const y2 = y1 + sin(angle) * length;

                branches.push(new TreeBranch(x1, y1, x2, y2, depth));

                // Create child branches
                const angleVar = random(0.3, 0.5);
                const lengthReduce = random(0.65, 0.75);

                createBranch(x2, y2, angle - angleVar, length * lengthReduce, depth + 1);
                createBranch(x2, y2, angle + angleVar, length * lengthReduce, depth + 1);

                // Sometimes add a middle branch
                if (random() > 0.7 && depth < 5) {
                    createBranch(x2, y2, angle + random(-0.2, 0.2),
                                length * lengthReduce * 0.8, depth + 1);
                }
            }

            // Generate main trunk and branches
            branches.push(new TreeBranch(
                trunkBase.x, trunkBase.y,
                trunkTop.x, trunkTop.y,
                0
            ));

            createBranch(trunkTop.x, trunkTop.y, -PI/2, 80, 1);

            console.log(`Generated ${branches.length} branches`);

            // Sample particles along branches
            const pointsPerBranch = Math.floor(CONFIG.TREE_PARTICLE_COUNT / branches.length);

            for (let branch of branches) {
                // Density increases toward tips
                const density = map(branch.depth, 0, 7, 0.5, 1.5);
                const numPoints = Math.floor(pointsPerBranch * density);

                for (let i = 0; i < numPoints; i++) {
                    const t = i / numPoints;
                    const x = lerp(branch.x1, branch.x2, t) + random(-3, 3);
                    const y = lerp(branch.y1, branch.y2, t) + random(-3, 3);

                    // Size varies by depth (tips are smaller)
                    const size = map(branch.depth, 0, 7,
                        CONFIG.PARTICLE_SIZE_MAX,
                        CONFIG.PARTICLE_SIZE_MIN);

                    particles.push(new Particle(x, y, size + random(-0.5, 0.5), true));
                }
            }

            console.log(`Created ${particles.length} tree particles`);
            return particles;
        }

        // ===========================================
        // DUST GENERATION
        // ===========================================
        function generateDustParticles() {
            const dust = [];
            for (let i = 0; i < CONFIG.DUST_COUNT; i++) {
                const x = random(width);
                const y = random(height);
                const size = random(1, 2.5);
                dust.push(new Particle(x, y, size, false));
            }
            console.log(`Created ${dust.length} dust particles`);
            return dust;
        }

        // ===========================================
        // CONNECTION GENERATION
        // ===========================================
        function generateConnections() {
            // Use spatial grid for efficient nearest neighbor search
            const connections = [];
            const gridSize = CONFIG.CONNECTION_DISTANCE;
            const grid = {};

            // Build spatial grid
            for (let p of treeParticles) {
                const gx = Math.floor(p.homeX / gridSize);
                const gy = Math.floor(p.homeY / gridSize);
                const key = `${gx},${gy}`;
                if (!grid[key]) grid[key] = [];
                grid[key].push(p);
            }

            // Find connections (limit total count for performance)
            for (let p1 of treeParticles) {
                if (connections.length >= CONFIG.CONNECTION_COUNT) break;

                const gx = Math.floor(p1.homeX / gridSize);
                const gy = Math.floor(p1.homeY / gridSize);

                // Check neighboring cells
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        const key = `${gx + dx},${gy + dy}`;
                        const neighbors = grid[key] || [];

                        for (let p2 of neighbors) {
                            if (p1 === p2) continue;

                            const d = dist(p1.homeX, p1.homeY, p2.homeX, p2.homeY);
                            if (d < CONFIG.CONNECTION_DISTANCE) {
                                connections.push({ p1, p2, dist: d });
                                if (connections.length >= CONFIG.CONNECTION_COUNT) {
                                    return connections;
                                }
                            }
                        }
                    }
                }
            }

            console.log(`Created ${connections.length} connections`);
            return connections;
        }

        // ===========================================
        // PORTAL SETUP
        // ===========================================
        function setupPortals() {
            const centerX = width / 2;
            const centerY = height * 0.6;
            const radius = Math.min(width, height) * 0.4;

            return [
                new Portal(centerX - radius, centerY - radius * 0.3, "SPRING", "spring"),
                new Portal(centerX + radius, centerY - radius * 0.3, "SUMMER", "summer"),
                new Portal(centerX - radius, centerY + radius * 0.5, "AUTUMN", "autumn"),
                new Portal(centerX + radius, centerY + radius * 0.5, "WINTER", "winter")
            ];
        }

        // ===========================================
        // UPDATE FUNCTIONS
        // ===========================================
        function updateHubParticles() {
            // Update tree particles
            for (let p of treeParticles) {
                p.update();
            }

            // Update dust particles
            for (let p of dustParticles) {
                p.update();
            }

            // Update portals
            for (let portal of portals) {
                portal.update();
            }

            // Update time
            timeOffset++;
        }

        // ===========================================
        // DRAW FUNCTIONS
        // ===========================================
        function drawHubTree() {
            // Draw connecting lines first (behind particles)
            stroke(CONFIG.CONNECTION_COLOR[0],
                   CONFIG.CONNECTION_COLOR[1],
                   CONFIG.CONNECTION_COLOR[2],
                   CONFIG.CONNECTION_ALPHA * 255);
            strokeWeight(0.5);

            for (let conn of connections) {
                // Fade based on distance
                const alpha = map(conn.dist, 0, CONFIG.CONNECTION_DISTANCE,
                    CONFIG.CONNECTION_ALPHA, 0);
                stroke(CONFIG.CONNECTION_COLOR[0],
                       CONFIG.CONNECTION_COLOR[1],
                       CONFIG.CONNECTION_COLOR[2],
                       alpha * 255);
                line(conn.p1.x, conn.p1.y, conn.p2.x, conn.p2.y);
            }

            // Draw particles
            for (let p of treeParticles) {
                p.draw();
            }
        }

        // ===========================================
        // MOUSE INTERACTION
        // ===========================================
        function handleHubMouseField() {
            mouseFieldActive = (mouseX > 0 && mouseX < width &&
                               mouseY > 0 && mouseY < height);
        }

        // ===========================================
        // ROOM STATE MANAGEMENT
        // ===========================================
        let roomState = {
            spring: { petals: [], windField: [] },
            summer: { waves: [], wavePoints: [] },
            autumn: { apples: [], basket: null },
            winter: { snowParticles: [], traces: [] }
        };

        function initializeRoom(room) {
            console.log(`Initializing ${room} room...`);

            switch(room) {
                case 'spring':
                    initializeSpring();
                    break;
                case 'summer':
                    initializeSummer();
                    break;
                case 'autumn':
                    initializeAutumn();
                    break;
                case 'winter':
                    initializeWinter();
                    break;
            }
        }

        // ===========================================
        // SPRING ROOM - Wind field + petals
        // ===========================================
        function initializeSpring() {
            roomState.spring.petals = [];
            // Generate some petal particles
            for (let i = 0; i < 100; i++) {
                roomState.spring.petals.push({
                    x: random(width),
                    y: random(height),
                    vx: random(-0.5, 0.5),
                    vy: random(0.5, 1.5),
                    size: random(4, 8),
                    rotation: random(TWO_PI),
                    rotSpeed: random(-0.05, 0.05),
                    color: [random(200, 255), random(150, 200), random(180, 230)]
                });
            }
        }

        function updateSpring(input) {
            // TODO: Process hand gesture input for wind field
            // For now, just update petals with gravity
            for (let petal of roomState.spring.petals) {
                petal.x += petal.vx;
                petal.y += petal.vy;
                petal.rotation += petal.rotSpeed;

                // Wrap around
                if (petal.y > height) {
                    petal.y = -20;
                    petal.x = random(width);
                }
                if (petal.x < 0) petal.x = width;
                if (petal.x > width) petal.x = 0;
            }
        }

        function drawSpring() {
            // Background gradient
            for (let i = 0; i < height; i++) {
                const inter = map(i, 0, height, 0, 1);
                const c = lerpColor(color(180, 220, 255), color(255, 240, 220), inter);
                stroke(c);
                line(0, i, width, i);
            }

            // Draw placeholder ground
            fill(100, 180, 100, 150);
            noStroke();
            rect(0, height * 0.7, width, height * 0.3);

            // Draw placeholder tree silhouette
            fill(80, 120, 80, 100);
            triangle(width/2, height * 0.3, width/2 - 100, height * 0.7, width/2 + 100, height * 0.7);

            // Draw petals
            for (let petal of roomState.spring.petals) {
                push();
                translate(petal.x, petal.y);
                rotate(petal.rotation);
                fill(petal.color[0], petal.color[1], petal.color[2], 200);
                noStroke();
                ellipse(0, 0, petal.size, petal.size * 1.5);
                pop();
            }

            // Label
            fill(100, 200, 255, 150);
            textAlign(CENTER, CENTER);
            textSize(48);
            text("SPRING", width/2, height * 0.15);
            textSize(16);
            text("(Low-fi placeholder - gesture control coming soon)", width/2, height * 0.2);
        }

        // ===========================================
        // SUMMER ROOM - Wave surface
        // ===========================================
        function initializeSummer() {
            roomState.summer.wavePoints = [];
            const spacing = 20;
            for (let x = 0; x <= width; x += spacing) {
                for (let y = 0; y <= height; y += spacing) {
                    roomState.summer.wavePoints.push({
                        x: x,
                        y: y,
                        baseY: y,
                        offset: random(TWO_PI)
                    });
                }
            }
        }

        function updateSummer(input) {
            // TODO: Process two-hand gesture for wave deformation
            // For now, just animate waves
            for (let point of roomState.summer.wavePoints) {
                const wave = sin(frameCount * 0.02 + point.offset + point.x * 0.01) * 15;
                point.y = point.baseY + wave;
            }
        }

        function drawSummer() {
            // Ocean gradient background
            for (let i = 0; i < height; i++) {
                const inter = map(i, 0, height, 0, 1);
                const c = lerpColor(color(100, 180, 255), color(20, 60, 120), inter);
                stroke(c);
                line(0, i, width, i);
            }

            // Draw wave points
            stroke(150, 220, 255, 100);
            strokeWeight(2);
            for (let point of roomState.summer.wavePoints) {
                point(point.x, point.y);
            }

            // Draw some wave lines
            noFill();
            stroke(200, 240, 255, 150);
            strokeWeight(1);
            for (let y = height * 0.3; y < height; y += 40) {
                beginShape();
                for (let x = 0; x <= width; x += 20) {
                    const wave = sin(frameCount * 0.02 + x * 0.01 + y * 0.005) * 20;
                    vertex(x, y + wave);
                }
                endShape();
            }

            // Label
            fill(100, 200, 255, 200);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(48);
            text("SUMMER", width/2, height * 0.15);
            textSize(16);
            text("(Low-fi placeholder - gesture control coming soon)", width/2, height * 0.2);
        }

        // ===========================================
        // AUTUMN ROOM - Apple picking
        // ===========================================
        function initializeAutumn() {
            roomState.autumn.apples = [];
            roomState.autumn.basket = { x: width/2, y: height * 0.85, width: 100, height: 40 };

            // Generate apples on tree
            for (let i = 0; i < 15; i++) {
                roomState.autumn.apples.push({
                    x: width/2 + random(-150, 150),
                    y: height * 0.3 + random(0, 200),
                    size: random(20, 30),
                    picked: false,
                    falling: false,
                    vy: 0
                });
            }
        }

        function updateAutumn(input) {
            // TODO: Process picking gesture
            // For now, make apples fall when clicked
            for (let apple of roomState.autumn.apples) {
                if (apple.falling) {
                    apple.vy += 0.5; // gravity
                    apple.y += apple.vy;

                    // Check basket collision
                    if (apple.y >= roomState.autumn.basket.y &&
                        apple.x >= roomState.autumn.basket.x - roomState.autumn.basket.width/2 &&
                        apple.x <= roomState.autumn.basket.x + roomState.autumn.basket.width/2) {
                        apple.picked = true;
                        apple.falling = false;
                    }

                    // Remove if fell off screen
                    if (apple.y > height + 50) {
                        apple.falling = false;
                        apple.y = -1000; // hide it
                    }
                }
            }
        }

        function drawAutumn() {
            // Autumn sky gradient
            for (let i = 0; i < height; i++) {
                const inter = map(i, 0, height, 0, 1);
                const c = lerpColor(color(255, 200, 150), color(200, 120, 80), inter);
                stroke(c);
                line(0, i, width, i);
            }

            // Ground
            fill(160, 100, 60, 150);
            noStroke();
            rect(0, height * 0.75, width, height * 0.25);

            // Tree trunk and branches (simple)
            fill(100, 60, 40);
            rect(width/2 - 20, height * 0.3, 40, height * 0.45);
            ellipse(width/2, height * 0.35, 300, 200);

            // Draw basket
            fill(160, 120, 80);
            stroke(100, 70, 50);
            strokeWeight(2);
            rect(roomState.autumn.basket.x - roomState.autumn.basket.width/2,
                 roomState.autumn.basket.y,
                 roomState.autumn.basket.width,
                 roomState.autumn.basket.height,
                 5);

            // Draw apples
            noStroke();
            for (let apple of roomState.autumn.apples) {
                if (!apple.picked && apple.y > -100) {
                    fill(220, 50, 50);
                    circle(apple.x, apple.y, apple.size);
                    // stem
                    stroke(100, 60, 40);
                    strokeWeight(2);
                    line(apple.x, apple.y - apple.size/2, apple.x, apple.y - apple.size/2 - 5);
                }
            }

            // Label
            fill(200, 100, 50, 200);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(48);
            text("AUTUMN", width/2, height * 0.12);
            textSize(16);
            text("(Low-fi placeholder - gesture control coming soon)", width/2, height * 0.17);
            textSize(12);
            text("Click apples to make them fall", width/2, height * 0.21);
        }

        // ===========================================
        // WINTER ROOM - Snow sculpting
        // ===========================================
        function initializeWinter() {
            roomState.winter.snowParticles = [];
            roomState.winter.traces = [];

            // Falling snow
            for (let i = 0; i < 150; i++) {
                roomState.winter.snowParticles.push({
                    x: random(width),
                    y: random(height),
                    vx: random(-0.3, 0.3),
                    vy: random(0.5, 1.5),
                    size: random(2, 6)
                });
            }
        }

        function updateWinter(input) {
            // TODO: Process two-hand sculpting gesture
            // For now, just update falling snow
            for (let snow of roomState.winter.snowParticles) {
                snow.x += snow.vx;
                snow.y += snow.vy;

                // Wrap around
                if (snow.y > height) {
                    snow.y = -10;
                    snow.x = random(width);
                }
                if (snow.x < 0) snow.x = width;
                if (snow.x > width) snow.x = 0;
            }

            // Add mouse traces (simulating hand trails)
            if (mouseIsPressed) {
                roomState.winter.traces.push({
                    x: mouseX,
                    y: mouseY,
                    life: 1.0
                });
            }

            // Update traces
            for (let i = roomState.winter.traces.length - 1; i >= 0; i--) {
                roomState.winter.traces[i].life -= 0.01;
                if (roomState.winter.traces[i].life <= 0) {
                    roomState.winter.traces.splice(i, 1);
                }
            }
        }

        function drawWinter() {
            // Winter sky gradient
            for (let i = 0; i < height; i++) {
                const inter = map(i, 0, height, 0, 1);
                const c = lerpColor(color(200, 220, 240), color(240, 250, 255), inter);
                stroke(c);
                line(0, i, width, i);
            }

            // Snow ground
            fill(240, 245, 255, 200);
            noStroke();
            rect(0, height * 0.7, width, height * 0.3);

            // Draw traces (hand trails)
            for (let trace of roomState.winter.traces) {
                fill(150, 200, 255, trace.life * 150);
                noStroke();
                circle(trace.x, trace.y, 15);
            }

            // Draw falling snow
            fill(255, 255, 255, 200);
            noStroke();
            for (let snow of roomState.winter.snowParticles) {
                circle(snow.x, snow.y, snow.size);
            }

            // Draw placeholder snowman
            fill(255);
            stroke(200);
            strokeWeight(2);
            circle(width/2, height * 0.55, 80);
            circle(width/2, height * 0.65, 100);

            // Label
            fill(100, 150, 200, 200);
            noStroke();
            textAlign(CENTER, CENTER);
            textSize(48);
            text("WINTER", width/2, height * 0.12);
            textSize(16);
            text("(Low-fi placeholder - gesture control coming soon)", width/2, height * 0.17);
            textSize(12);
            text("Click and drag to leave traces", width/2, height * 0.21);
        }

        // ===========================================
        // P5.JS MAIN FUNCTIONS
        // ===========================================
        function setup() {
            createCanvas(windowWidth, windowHeight);

            // Generate all elements
            treeParticles = generateTreePoints();
            dustParticles = generateDustParticles();
            connections = generateConnections();
            portals = setupPortals();

            console.log("Hub initialized successfully!");
        }

        function draw() {
            // Route rendering based on current state
            if (currentState === "hub") {
                drawHub();
            } else if (currentState === "spring") {
                updateSpring(handLandmarks);
                drawSpring();
            } else if (currentState === "summer") {
                updateSummer(handLandmarks);
                drawSummer();
            } else if (currentState === "autumn") {
                updateAutumn(handLandmarks);
                drawAutumn();
            } else if (currentState === "winter") {
                updateWinter(handLandmarks);
                drawWinter();
            }

            // Performance indicator
            if (frameCount % 60 === 0) {
                console.log(`FPS: ${Math.round(frameRate())}`);
            }
        }

        // Hub rendering pipeline (kept exactly as original)
        function drawHub() {
            // Dark background with slight transparency for trail effect
            background(0, 0, 0, 25);

            // Draw dust layer (background)
            for (let p of dustParticles) {
                p.draw();
            }

            // Update all elements
            updateHubParticles();
            handleHubMouseField();

            // Draw tree with connections
            drawHubTree();

            // Draw portals (foreground)
            for (let portal of portals) {
                portal.draw();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);

            // Regenerate everything on resize
            treeParticles = generateTreePoints();
            connections = generateConnections();
            portals = setupPortals();
        }

        function mouseClicked() {
            if (currentState === "hub") {
                // Check portal clicks
                for (let portal of portals) {
                    portal.click();
                }
            } else if (currentState === "autumn") {
                // Check apple clicks
                for (let apple of roomState.autumn.apples) {
                    if (!apple.picked && !apple.falling) {
                        const d = dist(mouseX, mouseY, apple.x, apple.y);
                        if (d < apple.size / 2) {
                            apple.falling = true;
                            console.log("Apple clicked!");
                        }
                    }
                }
            }
        }

        // Cursor feedback
        function mouseMoved() {
            if (currentState === "hub") {
                let hovering = false;
                for (let portal of portals) {
                    if (portal.hovered) {
                        hovering = true;
                        break;
                    }
                }
                cursor(hovering ? 'pointer' : 'default');
            } else if (currentState === "autumn") {
                // Check if hovering over apples
                let hoveringApple = false;
                for (let apple of roomState.autumn.apples) {
                    if (!apple.picked && !apple.falling) {
                        const d = dist(mouseX, mouseY, apple.x, apple.y);
                        if (d < apple.size / 2) {
                            hoveringApple = true;
                            break;
                        }
                    }
                }
                cursor(hoveringApple ? 'pointer' : 'default');
            } else {
                cursor('default');
            }
        }
    </script>
